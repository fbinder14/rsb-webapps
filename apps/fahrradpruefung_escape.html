<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verkehrsgarten-Escape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: ein Verkehrsgarten von oben – Wiese als Grund, Asphalt-Straße als Karte, Stationen sind Verkehrsschilder, Aufgaben liegen auf weißen „Schildertafeln". */
:root{
  --bg:#e6f2d9; --bg-dot:#d3e8c0;
  --panel:#ffffff; --panel-2:#f4f8f0;
  --ink:#1c2a33; --muted:#566570; --line:#d5e1cc;
  --asphalt:#39424a; --asphalt-2:#4a545d; --mark:#ffffff;
  --grass:#8ccb66; --grass-2:#71b84f;
  --blue:#1d5fc4; --blue-d:#13428c;
  --red:#d7312f; --red-d:#9d1f1d;
  --yellow:#ffc72c; --yellow-d:#c99400;
  --green:#2b9a4d; --green-d:#1d6d36;
  --good-bg:#e3f6e8; --bad-bg:#fde7e6;
  --chip:#eef3ea;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12191d; --bg-dot:#1a2429; --panel:#1d272d; --panel-2:#243139; --ink:#eef4f6; --muted:#a8b6bf; --line:#33434c;
  --asphalt:#2a3137; --asphalt-2:#3a434b; --grass:#2f5c34; --grass-2:#27502c;
  --good-bg:#1d3b27; --bad-bg:#44201f; --chip:#2a363d; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12191d; --bg-dot:#1a2429; --panel:#1d272d; --panel-2:#243139; --ink:#eef4f6; --muted:#a8b6bf; --line:#33434c;
  --asphalt:#2a3137; --asphalt-2:#3a434b; --grass:#2f5c34; --grass-2:#27502c;
  --good-bg:#1d3b27; --bad-bg:#44201f; --chip:#2a363d; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--bg-dot) 1.6px,transparent 1.7px);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}
h1,h2,h3,.disp{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}

/* Kopfzeile */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;cursor:pointer;background:none;border:0;padding:0}
.brand svg{width:44px;height:44px}
.brand b{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.2px}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:800;font-size:15px;cursor:pointer}
.tbtn:hover{border-color:var(--blue)}
.tbtn svg{width:18px;height:18px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 22px;font-family:var(--display);font-weight:600;font-size:19px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}
.btn.go{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.btn.warn{background:var(--yellow);color:#2a2100;box-shadow:0 5px 0 var(--yellow-d)}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.btn.ghost{background:var(--panel-2);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.panel{background:var(--panel);border-radius:var(--r);box-shadow:0 6px 0 rgba(0,0,0,.08),0 16px 34px rgba(30,60,20,.10);padding:22px}

/* Intro */
.intro{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center}
.intro h1{font-size:clamp(32px,6vw,54px);font-weight:700}
.intro h1 em{font-style:normal;color:var(--red)}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--green)}
.story{font-size:18px;color:var(--ink)}
.namerow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.namerow input{flex:1 1 200px;min-width:0;font:inherit;font-size:19px;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:var(--panel-2);color:var(--ink)}
.namerow input:focus{border-color:var(--blue);outline:none}
.gateart{width:100%;max-width:420px;justify-self:center}

/* Karte */
.mapbox{background:var(--grass);border-radius:var(--r);overflow:hidden;box-shadow:inset 0 0 0 4px rgba(0,0,0,.06)}
.mapbox svg{display:block;width:100%;height:auto}
.st{cursor:pointer}
.st.locked{cursor:not-allowed}
.st:hover .stc, .st:focus-visible .stc{transform:scale(1.08)}
.stc{transform-box:fill-box;transform-origin:center;transition:transform .15s}
.hello{display:flex;gap:14px;align-items:center;margin-block:16px}
.hello svg{width:62px;flex:0 0 62px}
.bubble{background:var(--panel);border-radius:16px;padding:12px 16px;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.06);flex:1;min-width:0}
.bubble:before{content:"";position:absolute;left:-10px;top:22px;border:10px solid transparent;border-right-color:var(--panel);border-left:0}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.lcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:3px solid transparent;border-radius:16px;padding:12px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.07)}
.lcard:hover:not([disabled]){border-color:var(--blue)}
.lcard[disabled]{opacity:.55;cursor:not-allowed}
.lcard svg.sg{width:52px;height:52px;flex:0 0 52px}
.lcard .lt{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.2}
.lcard .lm{font-size:13px;color:var(--muted);font-weight:700}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars svg{width:18px;height:18px}
.codebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;background:var(--asphalt);color:#fff;border-radius:16px;padding:12px 16px}
.codebar .cl{font-weight:800;margin-right:6px}
.digit{width:40px;height:50px;border-radius:10px;background:#fff;color:#1c2a33;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:700;border:3px dashed #9aa6ae}
.digit.got{border:3px solid var(--yellow);background:#fff8dd}
.badge{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--ink)}
.b1{background:#dff3e3;color:#1d6d36}.b2{background:#fff1c7;color:#7a5a00}.b3{background:#ffe0cc;color:#8a3a00}.b4{background:#fbd9d8;color:#8f1e1c}
:root[data-theme="dark"] .b1,:root[data-theme="dark"] .b2,:root[data-theme="dark"] .b3,:root[data-theme="dark"] .b4{filter:brightness(.92)}

/* Level */
.lhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lhead h2{font-size:clamp(22px,4vw,30px);margin-right:auto}
.prog{height:12px;background:var(--panel);border-radius:99px;overflow:hidden;margin-bottom:16px;box-shadow:inset 0 0 0 2px var(--line)}
.prog i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--yellow) 0 18px,var(--asphalt) 18px 26px);transition:width .4s}
.hearts{display:flex;gap:4px}
.hearts svg{width:26px;height:26px}
.task{display:grid;gap:16px}
.q{font-size:clamp(19px,3vw,23px);font-weight:800;line-height:1.35}
.vis{display:flex;justify-content:center}
.vis svg{max-width:100%;height:auto}
.vis .xing{width:min(380px,100%)}
.vis .bigsign{width:150px;height:150px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--line);background:var(--panel-2);border-radius:16px;padding:14px 16px;cursor:pointer;font-weight:700;font-size:17px;min-width:0}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt .k{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--asphalt);color:#fff;font-family:var(--display);font-weight:600}
.opt.ok{border-color:var(--green);background:var(--good-bg)}
.opt.ok .k{background:var(--green)}
.opt.no{border-color:var(--red);background:var(--bad-bg);opacity:.8}
.opt.no .k{background:var(--red)}
.opt.pic{flex-direction:column;justify-content:center;text-align:center}
.opt.pic svg{width:110px;height:120px}
.opt[disabled]{cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--line);background:var(--panel-2);border-radius:999px;padding:9px 16px;font-weight:800;cursor:pointer;font-size:16px}
.chip.on{border-color:var(--blue);background:var(--blue);color:#fff}
.chip.ok{border-color:var(--green);background:var(--green);color:#fff}
.chip.no{border-color:var(--red);background:var(--bad-bg)}
.chip.miss{border-style:dashed;border-color:var(--green)}
.slots{display:grid;gap:8px;counter-reset:s}
.slot{display:flex;gap:10px;align-items:center;min-height:52px;border:3px dashed var(--line);border-radius:14px;padding:8px 12px;background:var(--panel-2)}
.slot .n{flex:0 0 32px;height:32px;border-radius:50%;background:var(--yellow);color:#2a2100;display:grid;place-items:center;font-family:var(--display);font-weight:700}
.slot.filled{border-style:solid;border-color:var(--blue);cursor:pointer}
.slot.ok{border-color:var(--green);background:var(--good-bg)}
.slot.no{border-color:var(--red);background:var(--bad-bg)}
.slot span.t{font-weight:700;min-width:0}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.pool .chip{border-radius:14px;text-align:left}
.tf{display:grid;gap:10px}
.tfrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:3px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--panel-2)}
.tfrow p{margin:0;flex:1 1 240px;font-weight:700;min-width:0}
.tfrow .tfb{display:flex;gap:8px}
.tfrow button{border:3px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 14px;font-weight:800;cursor:pointer}
.tfrow.ok{border-color:var(--green);background:var(--good-bg)}
.tfrow.no{border-color:var(--red)}
.tfrow small{flex-basis:100%;color:var(--muted);font-weight:600}
.hz{cursor:pointer;transition:opacity .15s}
.hz:hover{opacity:.75}
.fb{border-radius:16px;padding:14px 16px;font-weight:600}
.fb.good{background:var(--good-bg);border:3px solid var(--green)}
.fb.bad{background:var(--bad-bg);border:3px solid var(--red)}
.fb b{font-family:var(--display);font-size:20px;display:block;margin-bottom:2px}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.ringo{display:flex;gap:12px;align-items:flex-start}
.ringo svg{width:54px;flex:0 0 54px}
.ringo .bubble{background:var(--panel-2)}
.ringo .bubble:before{border-right-color:var(--panel-2)}
.parcmap{background:var(--grass);border-radius:16px;overflow:hidden}
.parcmap svg{display:block;width:100%;height:auto}
#pbike{transition:transform 1.1s cubic-bezier(.5,0,.3,1)}

/* Overlay */
.ov{position:fixed;inset:0;background:rgba(10,20,15,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.ovc{background:var(--panel);border-radius:22px;max-width:560px;width:100%;padding:26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.ovc h2{font-size:30px;margin-bottom:8px}
.bigdigit{font-family:var(--display);font-size:80px;font-weight:700;width:120px;height:140px;margin:10px auto;display:grid;place-items:center;background:#fff8dd;color:#1c2a33;border:5px solid var(--yellow);border-radius:20px;transform:rotate(-4deg);animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
.bigstars{display:flex;justify-content:center;gap:6px;margin:6px 0 14px}
.bigstars svg{width:46px;height:46px}

/* Lernbuch */
.book{max-width:860px;text-align:left}
.book h2{text-align:left}
.book h3{font-size:22px;margin:22px 0 8px;color:var(--blue)}
.book p,.book li{max-width:68ch}
.book ul,.book ol{padding-left:22px;margin:6px 0}
.signgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:8px}
.signgrid figure{margin:0;background:var(--panel-2);border-radius:14px;padding:10px;text-align:center;font-size:14px;font-weight:700}
.signgrid svg{width:72px;height:72px;display:block;margin:0 auto 6px}
.booknav{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.booknav a{font-weight:800;font-size:14px;color:var(--blue);background:var(--chip);border-radius:999px;padding:5px 12px;text-decoration:none}
.closex{float:right}

/* Tor & Schloss */
.lock{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.wheel{display:grid;gap:6px;justify-items:center}
.wheel button{width:52px;height:38px;border-radius:10px;border:0;background:var(--asphalt-2);color:#fff;font-size:20px;cursor:pointer}
.wheel .wd{width:58px;height:72px;border-radius:12px;background:linear-gradient(#fff,#e8edf0 50%,#fff);color:#1c2a33;display:grid;place-items:center;font-family:var(--display);font-size:42px;font-weight:700;border:4px solid var(--asphalt);font-variant-numeric:tabular-nums}
.lock.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* Urkunde */
.cert{background:#fffdf5;color:#1c2a33;border-radius:18px;padding:26px;border:10px solid var(--blue);outline:4px dashed var(--yellow);outline-offset:-22px;text-align:center;position:relative}
.cert h2{font-size:clamp(28px,5vw,42px);color:var(--blue)}
.cert .nm{font-family:var(--display);font-size:clamp(30px,6vw,48px);color:var(--red);margin:6px 0;border-bottom:3px solid #1c2a33;display:inline-block;padding:0 18px}
.cert .seal{width:96px;height:96px;margin:0 auto 8px}.cert .seal svg{width:100%;height:100%}.bigsign{width:150px;height:150px;flex:0 0 auto}
.cert p{max-width:52ch;margin-inline:auto}
.cert small{color:#566570}

.conf{position:fixed;top:-20px;width:12px;height:18px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.foot{margin-top:28px;font-size:14px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-weight:700;padding:0}

@media (max-width:760px){
  .intro{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  body{font-size:16px}
  .opts{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .panel{padding:16px}
  .brand b{font-size:19px}
  .wheel .wd{width:44px;height:60px;font-size:34px}
  .wheel button{width:44px}
  .lock{gap:6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .top,.foot,.noprint{display:none!important}
  body{background:#fff}
  .ov{position:static;background:none;padding:0}
  .ovc{box-shadow:none;max-width:none}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <button class="brand" id="homeBtn" aria-label="Zur Karte">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="#1d5fc4" stroke="#fff" stroke-width="4"/><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="62" r="13"/><circle cx="70" cy="62" r="13"/><path d="M30 62 L42 44 L63 44 L70 62 M42 44 L50 62 L30 62 M50 62 L63 44 M38 37 L47 37 M42 44 L41 37 M63 44 L60 35 L67 35"/></g></svg>
      <span><small>Fahrradprüfung 4. Klasse</small><b>Verkehrsgarten-Escape</b></span>
    </button>
    <button class="tbtn" id="bookBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 7h6"/></svg>Lernbuch</button>
    <button class="tbtn" id="soundBtn" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="sndwave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg><span id="soundLbl">Ton an</span></button>
  </header>
  <main id="app"></main>
  <footer class="foot">
    <span>Übungsspiel zur Radfahrausbildung in Bayern. Es ersetzt nicht die Übung mit der Polizei und den Eltern.</span>
    <button id="resetBtn">Neues Spiel starten</button>
  </footer>
</div>
<div id="ovRoot"></div>

<script>
/* ============ Zustand ============ */
const KEY='verkehrsgarten-escape-v1';
let S=loadState();
function freshState(){return {name:'',done:{},code:Array.from({length:6},()=>Math.floor(Math.random()*9)+1),muted:false,finished:false}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.code&&s.code.length===6)return s}catch(e){}return freshState()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ============ Ton ============ */
let AC;
function tone(f,d,type,t0,vol){if(S.muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;const t=AC.currentTime+(t0||0);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={
  ok(){tone(1568,.5,'sine',0,.12);tone(2093,.7,'sine',.11,.09)},
  no(){tone(180,.22,'square',0,.05);tone(140,.3,'square',.12,.05)},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.4,'triangle',i*.11,.11))},
  click(){tone(900,.05,'sine',0,.05)}
};
function updSound(){$('#soundLbl').textContent=S.muted?'Ton aus':'Ton an';$('#soundBtn').setAttribute('aria-pressed',String(!S.muted));$('#sndwave').style.display=S.muted?'none':''}

/* ============ Grafiken ============ */
const BIKE=(c,sw)=>`<g fill="none" stroke="${c||'#fff'}" stroke-width="${sw||5}" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="62" r="13"/><circle cx="70" cy="62" r="13"/><path d="M30 62 L42 44 L63 44 L70 62 M42 44 L50 62 L30 62 M50 62 L63 44 M38 37 L47 37 M42 44 L41 37 M63 44 L60 35 L67 35"/></g>`;
const PED=(x,y,s,c)=>`<g fill="${c}" transform="translate(${x} ${y}) scale(${s})"><circle cx="0" cy="-24" r="5.5"/><path d="M-6 -16 h12 l3 17 h-4.5 l-1.5 -10 v30 h-5 v-17 h-1 v17 h-5 v-30 l-1.5 10 h-4.5z"/></g>`;
const blueRound=inner=>`<circle cx="50" cy="50" r="47" fill="#fff"/><circle cx="50" cy="50" r="44" fill="#1d5fc4"/>${inner}`;
const redRing=inner=>`<circle cx="50" cy="50" r="47" fill="#d7312f"/><circle cx="50" cy="50" r="36" fill="#fff"/>${inner}`;
const triUp=inner=>`<path d="M50 5 L96 88 Q97 92 92 92 H8 Q3 92 4 88 Z" fill="#d7312f"/><path d="M50 24 L81 80 H19 Z" fill="#fff"/>${inner}`;

/* Kreuzung von oben */
function crossing(o){
  const arms=o.arms||['N','E','S','W'];
  const has=a=>arms.includes(a);
  let s=`<svg viewBox="0 0 400 400" class="xing" role="img" aria-label="${esc(o.aria||'Kreuzung von oben')}"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#1c2a33"/></marker></defs>
  <rect width="400" height="400" fill="#8ccb66"/>
  <g fill="#c9c3b5"><rect x="${has('W')?0:128}" y="128" width="${(has('E')?400:272)-(has('W')?0:128)}" height="144"/><rect x="128" y="${has('N')?0:128}" width="144" height="${(has('S')?400:272)-(has('N')?0:128)}"/></g>
  <g fill="#4a545d"><rect x="${has('W')?0:140}" y="140" width="${(has('E')?400:260)-(has('W')?0:140)}" height="120"/><rect x="140" y="${has('N')?0:140}" width="120" height="${(has('S')?400:260)-(has('N')?0:140)}"/></g>
  <g stroke="#fff" stroke-width="3" stroke-dasharray="14 12">${has('S')?'<line x1="200" y1="270" x2="200" y2="400"/>':''}${has('N')?'<line x1="200" y1="0" x2="200" y2="130"/>':''}${has('E')?'<line x1="270" y1="200" x2="400" y2="200"/>':''}${has('W')?'<line x1="0" y1="200" x2="130" y2="200"/>':''}</g>`;
  const POS={S:[222,322,0],N:[178,78,180],E:[322,178,-90],W:[78,222,90]};
  const LAB={S:[0,52],N:[0,-52],E:[0,-40],W:[0,40]};
  const SG={S:[288,292],N:[112,108],E:[300,106],W:[100,294]};
  (o.signs||[]).forEach(g=>{const p=SG[g.arm];s+=`<g transform="translate(${p[0]-22} ${p[1]-22}) scale(.44)">${SIGNS[g.id]}</g>`;if(g.id==='stop'){const P=POS[g.arm];s+=`<g transform="translate(${P[0]} ${P[1]}) rotate(${P[2]})"><rect x="-22" y="-62" width="44" height="6" fill="#fff"/></g>`}});
  (o.veh||[]).forEach(v=>{const p=POS[v.from];
    const arrow={straight:'M0 -30 L0 -112',left:'M0 -30 Q0 -122 -96 -122',right:'M0 -30 Q0 -58 34 -60'}[v.turn||'straight'];
    const body=v.kind==='bike'
      ?`<rect x="-3" y="-24" width="6" height="48" rx="3" fill="#2b2f33"/><rect x="-14" y="-16" width="28" height="5" rx="2" fill="#5a6670"/><circle cx="0" cy="2" r="10" fill="${v.color||'#ffc72c'}" stroke="#1c2a33" stroke-width="2"/><circle cx="0" cy="-4" r="6" fill="#d7312f"/>`
      :`<rect x="-16" y="-27" width="32" height="54" rx="8" fill="${v.color||'#d7312f'}" stroke="#1c2a33" stroke-width="2"/><rect x="-12" y="-17" width="24" height="11" rx="3" fill="#cfe7ff"/><rect x="-12" y="12" width="24" height="7" rx="2" fill="#cfe7ff"/>`;
    s+=`<g transform="translate(${p[0]} ${p[1]}) rotate(${p[2]})"><path d="${arrow}" stroke="#1c2a33" stroke-width="5" fill="none" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ah)"/>${body}</g>`;
    const l=LAB[v.from],w=Math.max(40,v.label.length*10+18);
    s+=`<g transform="translate(${p[0]+l[0]} ${p[1]+l[1]})"><rect x="${-w/2}" y="-14" width="${w}" height="28" rx="14" fill="#fff" stroke="#1c2a33" stroke-width="2"/><text y="6" text-anchor="middle" font-family="Fredoka,Nunito,sans-serif" font-weight="600" font-size="17" fill="#1c2a33">${esc(v.label)}</text></g>`;
  });
  if(o.police){s+=`<g transform="translate(200 200)"><circle r="17" fill="#2b9a4d" stroke="#fff" stroke-width="3"/><circle cy="-4" r="7" fill="#f2c9a0"/><rect x="-9" y="-14" width="18" height="6" fill="#1c2a33"/></g>`}
  return s+'</svg>';
}

    ex:'Ein verkehrssicheres Fahrrad hat 2 Bremsen, eine Klingel, vorne weißes Licht und einen weißen Rückstrahler, hinten rotes Licht und einen roten Rückstrahler, gelbe Rückstrahler an den Pedalen und Reflektoren an der Seite (Speichen oder Reifen). Ständer, Gepäckträger oder Tacho sind praktisch, aber keine Pflicht.'},
  {type:'zones',q:'Tippe auf das Teil, mit dem du andere warnen kannst.',vis:()=>bikeSide(true),a:'klingel',
    hint:'Es macht „Kling-kling!" und sitzt am Lenker.',

    ex:'Die Klingel muss hell klingen. Klingeln darfst du nur, um andere zu warnen, nicht zum Spaß.'},
  {type:'zones',q:'Tippe auf das Teil, das nach vorne weißes Licht gibt.',vis:()=>bikeSide(true),a:'licht',
    hint:'Es sitzt vorne am Rad und leuchtet nach vorne auf die Straße.',
    wrong:{klingel:'Das ist die Klingel.',ruecklicht:'Das ist das Rücklicht. Es leuchtet rot nach hinten.',bremse:'Das sind die Bremshebel.',pedal:'Das ist ein Pedal.',speichen:'Das sind die Speichen-Reflektoren.',staender:'Das ist der Ständer.'},
    ex:'Der Scheinwerfer leuchtet vorne weiß. Bei Dämmerung, Dunkelheit und Nebel muss das Licht an sein.'},
  {type:'mc',q:'Welche Farbe hat das Licht hinten am Fahrrad?',opts:['Rot','Weiß','Gelb','Blau'],a:0,
    hint:'Auch Autos haben hinten Lichter in dieser Farbe.',ex:'Hinten leuchtet das Rücklicht rot. Dazu kommt ein roter Rückstrahler.'},
  {type:'mc',q:'Wie viele Bremsen braucht dein Fahrrad?',opts:['Zwei, die unabhängig voneinander funktionieren','Eine reicht, wenn sie gut ist','Drei Bremsen','Gar keine, man kann mit den Füßen bremsen'],a:0,
    hint:'Eine fürs Vorderrad und eine fürs …',ex:'Du brauchst zwei Bremsen, die unabhängig voneinander funktionieren. Fällt eine aus, kannst du mit der anderen noch anhalten.'},
  {type:'mc',q:'Wie sitzt der Fahrradhelm richtig?',opts:['Gerade auf dem Kopf, knapp über den Augenbrauen, Kinnriemen zu','Weit nach hinten geschoben, damit man gut sieht','Locker, der Riemen darf offen bleiben','Über einer dicken Mütze, egal wie'],a:0,
    hint:'Der Helm soll die Stirn schützen und darf nicht wackeln.',ex:'Der Helm sitzt gerade, etwa zwei Finger breit über den Augenbrauen. Der Kinnriemen ist zu – zwischen Riemen und Kinn passt nur ein Finger. Eine Helmpflicht gibt es nicht, aber ein Helm schützt deinen Kopf. Bei der Radfahrprüfung trägst du ihn immer.'}
  ]},
{ id:2, title:'Der Schilderwald', diff:'Leicht', dcls:'b1', icon:'vorfahrtgewaehren', mx:[330,300],
  story:'Im Schilderwald stehen überall Verkehrszeichen. An jedem Baum hängt ein Rätsel. Nur wer alle Schilder lesen kann, findet den Weg hinaus.',
  tasks:[
  {type:'mc',q:'Was bedeuten Schilder mit einem roten Rand meistens?',vis:()=>`<div style="display:flex;gap:12px">${sign('verbotrad','bigsign')}${sign('einfahrt','bigsign')}</div>`,
    opts:['Etwas ist verboten','Hier darfst du etwas','Hier gibt es Eis','Hier beginnt ein Radweg'],a:0,
    hint:'Rot ist die Farbe für „Halt, nicht erlaubt!"',ex:'Runde Schilder mit rotem Rand sind Verbote. Runde blaue Schilder sind Gebote („das musst du tun"). Dreieckige Schilder mit rotem Rand warnen dich vor einer Gefahr.'},
  {type:'mc',q:'Was bedeutet dieses Schild?',vis:()=>sign('stop','bigsign'),
    opts:['Ganz anhalten und Vorfahrt gewähren','Langsam weiterrollen','Hier ist eine Bushaltestelle','Nur Autos müssen halten'],a:0,
    hint:'Es hat acht Ecken – so sieht nur ein einziges Schild aus.',ex:'Am Stoppschild hältst du an der weißen Haltlinie ganz an (Fuß auf den Boden). Dann lässt du alle auf der Vorfahrtstraße vorbei.'},
  {type:'mc',q:'Was bedeutet dieses Schild?',vis:()=>sign('vorfahrtgewaehren','bigsign'),
    opts:['Vorfahrt gewähren – die anderen dürfen zuerst','Du hast Vorfahrt','Achtung, Baustelle','Ende der Straße'],a:0,
    hint:'Das Dreieck steht auf dem Kopf.',ex:'Das auf dem Kopf stehende Dreieck heißt: Vorfahrt gewähren. Du musst die Fahrzeuge auf der anderen Straße zuerst fahren lassen. Anhalten musst du nur, wenn jemand kommt.'},
  {type:'mc',q:'Was bedeutet dieses Schild?',vis:()=>sign('vorfahrtstrasse','bigsign'),
    opts:['Du fährst auf einer Vorfahrtstraße','Hier gilt rechts vor links','Gelbe Ampel','Vorsicht, Kinder'],a:0,
    hint:'Die gelbe Raute ist ein gutes Zeichen für dich.',ex:'Die gelbe Raute zeigt: Du bist auf der Vorfahrtstraße und hast an allen Kreuzungen Vorfahrt, bis das Schild „Ende der Vorfahrtstraße" kommt. Trotzdem: immer bremsbereit bleiben!'},
  {type:'mc',q:'Was bedeutet dieses Schild?',vis:()=>sign('radweg','bigsign'),
    opts:['Radweg – hier musst du mit dem Rad fahren','Fahrräder verboten','Fahrradladen in der Nähe','Fahrrad-Parkplatz'],a:0,
    hint:'Runde blaue Schilder sagen dir, was du tun musst.',ex:'Ein blaues rundes Schild mit Fahrrad ist ein Radweg. Ist er da, musst du ihn benutzen.'},
  {type:'mc',q:'Was bedeutet dieses Schild?',vis:()=>sign('gemeinsam','bigsign'),
    opts:['Gemeinsamer Geh- und Radweg – nimm Rücksicht auf Fußgänger','Getrennter Weg: oben Fußgänger, unten Räder','Nur Fußgänger erlaubt','Spielstraße'],a:0,
    hint:'Der Strich liegt quer. Alle teilen sich den ganzen Weg.',ex:'Waagrechter Strich: Fußgänger und Radfahrer teilen sich den Weg. Fahre langsam und klingle rechtzeitig. Beim Schild mit senkrechtem Strich ist der Weg getrennt: eine Seite für Räder, eine für Fußgänger.'},
  {type:'mc',q:'Was bedeutet dieses Schild?',vis:()=>sign('verbotrad','bigsign'),
    opts:['Verbot für Radfahrer','Radweg','Fahrradstraße','Hier darfst du schnell fahren'],a:0,
    hint:'Roter Rand – das kennst du schon.',ex:'Hier darfst du nicht mit dem Rad fahren. Du kannst absteigen und schieben.'},
  {type:'mc',q:'Was bedeutet dieses Schild?',vis:()=>sign('einfahrt','bigsign'),
    opts:['Verbot der Einfahrt – hier darfst du nicht hineinfahren','Hier musst du anhalten und warten','Parkverbot','Einbahnstraße in deine Richtung'],a:0,
    hint:'Der weiße Balken ist wie eine Schranke.',ex:'Das ist das Schild „Verbot der Einfahrt". Du siehst es oft am Ende einer Einbahnstraße.'},
  {type:'mc',q:'Was bedeuten diese beiden Schilder zusammen?',vis:()=>sign('einbahn','bigsign'),
    opts:['Einbahnstraße – aber Radfahrer dürfen in beide Richtungen fahren','Einbahnstraße – Radfahrer verboten','Nur Radfahrer dürfen hier fahren','Radfahrer müssen schieben'],a:0,
    hint:'Lies das kleine Zusatzschild genau: Fahrrad + „frei".',ex:'Ein Zusatzschild ändert die Regel. „Radfahrer frei" heißt: Du darfst die Einbahnstraße auch in Gegenrichtung fahren. Fahre dann ganz rechts und pass auf den Gegenverkehr auf.'},
  {type:'mc',q:'Was bedeutet dieses Schild?',vis:()=>sign('rechtsvorlinks','bigsign'),
    opts:['Kreuzung: Hier gilt rechts vor links','Hier ist ein Bahnübergang','Durchfahrt verboten','Kreuzung mit Ampel'],a:0,
    hint:'Das Kreuz zeigt die Kreuzung. Wer kommt dann zuerst?',ex:'Das Warnschild mit dem schrägen Kreuz sagt: An der nächsten Kreuzung gilt rechts vor links. Wer von rechts kommt, darf zuerst fahren.'}
  ]},
{ id:3, title:'Der Signalturm', diff:'Mittel', dcls:'b2', icon:'gefahr', mx:[520,190],
  story:'Oben im Signalturm blinken Lampen. Die Tür öffnet sich nur, wenn du zeigst, dass du richtig Handzeichen gibst, nach hinten schaust und die wichtigsten Regeln kennst.',
  tasks:[
  {type:'mc',pic:true,q:'Du willst nach RECHTS abbiegen. Welches Handzeichen gibst du? (Du siehst das Kind von hinten.)',
    opts:[{svg:()=>armFig('left'),t:'Linker Arm'},{svg:()=>armFig('right'),t:'Rechter Arm'},{svg:()=>armFig('both'),t:'Beide Arme'},{svg:()=>armFig('none'),t:'Kein Zeichen'}],a:1,
    hint:'Der Arm zeigt immer in die Richtung, in die du fahren willst.',ex:'Rechts abbiegen: rechten Arm waagrecht ausstrecken. Links abbiegen: linken Arm ausstrecken. Rechtzeitig vorher zeigen und beim Abbiegen beide Hände wieder an den Lenker – zum Bremsen!'},
  {type:'mc',q:'Wann musst du über die Schulter nach hinten schauen (Schulterblick)?',
    opts:['Vor dem Anfahren, Abbiegen und Vorbeifahren','Nur, wenn ein Auto hupt','Nur in der Nacht','Nie, dafür gibt es Spiegel'],a:0,
    hint:'Immer dann, wenn du deine Spur verlässt oder losfährst.',ex:'Der Schulterblick ist bei der Prüfung super wichtig! Vor jedem Anfahren, Abbiegen und Vorbeifahren schaust du über die Schulter nach hinten. Nur so siehst du, ob jemand kommt.'},
  {type:'order',q:'Du stehst mit dem Rad am rechten Fahrbahnrand und willst losfahren. Bringe die Schritte in die richtige Reihenfolge.',
    items:['Pedal nach vorne oben stellen','Über die linke Schulter nach hinten schauen','Handzeichen links geben','Noch einmal umschauen – wenn frei, losfahren und rechts fahren'],
    hint:'Zuerst bereit machen, dann schauen, dann zeigen.',ex:'So fährst du sicher an: Pedal hochstellen, Schulterblick links, Handzeichen links, noch einmal schauen und erst losfahren, wenn wirklich frei ist.'},
  {type:'mc',q:'Vor dir auf deiner Seite parkt ein Auto. Wie fährst du richtig vorbei?',
    opts:['Schulterblick links, Handzeichen links, mit etwa 1 m Abstand vorbei, danach wieder rechts fahren','Ganz knapp vorbei, damit du rechts bleibst','Auf den Gehweg ausweichen','Laut klingeln und einfach vorbeifahren'],a:0,
    hint:'Du wechselst kurz nach links – was machst du immer davor?',ex:'Ein Hindernis ist wie ein kleiner Spurwechsel: Schulterblick, Handzeichen links, mit großem Abstand vorbeifahren (eine Autotür könnte aufgehen!) und danach wieder rechts einordnen.'},
  {type:'tf',q:'Wahr oder falsch? Entscheide bei jedem Satz.',
    items:[
      {s:'Kinder unter 8 Jahren müssen mit dem Rad auf dem Gehweg fahren.',a:true,ex:'Richtig. Bis 8 Jahre musst du auf dem Gehweg fahren. Bis 10 Jahre darfst du es. Ab 10 fährst du auf dem Radweg oder der Straße.'},
      {s:'Auf der Straße fährst du möglichst weit rechts.',a:true,ex:'Richtig. Halte aber etwas Abstand zum Bordstein und zu parkenden Autos.'},
      {s:'Freihändig fahren ist erlaubt, wenn wenig Verkehr ist.',a:false,ex:'Falsch. Mindestens eine Hand muss immer am Lenker sein.'},
      {s:'Am Zebrastreifen darfst du mit dem Rad drüberfahren und hast Vorrang.',a:false,ex:'Falsch. Fahrend hast du am Zebrastreifen keinen Vorrang. Steig ab und schieb – dann bist du Fußgänger und hast Vorrang.'},
      {s:'Während der Fahrt mit dem Handy zu schreiben ist verboten.',a:true,ex:'Richtig. Das ist verboten. Handy weg beim Radfahren!'},
      {s:'Du darfst dich an einem fahrenden Auto oder Mofa festhalten.',a:false,ex:'Falsch. Das ist verboten und sehr gefährlich.'}
    ]}
  ]},
{ id:4, title:'Die Vorfahrts-Kreuzung', diff:'Mittel', dcls:'b3', icon:'vorfahrtstrasse', mx:[700,310],
  story:'In der Mitte des Verkehrsgartens liegt die große Kreuzung. Die Ampel ist kaputt, und auf dem Boden liegen Kärtchen mit kniffligen Fragen: Wer darf zuerst fahren?',

  {type:'mc',q:'Es gibt keine Schilder und keine Ampel. Wer darf zuerst fahren?',
    vis:()=>crossing({veh:[{from:'S',kind:'bike',label:'Du'},{from:'E',kind:'car',label:'Auto'}]}),
    opts:['Das Auto, weil es von rechts kommt','Du, weil du ein Fahrrad bist','Wer schneller ist','Beide gleichzeitig'],a:0,
    hint:'Schau, von welcher Seite das Auto aus deiner Sicht kommt.',ex:'Ohne Schilder gilt: rechts vor links. Das Auto kommt von deiner rechten Seite und darf zuerst fahren.'},
  {type:'mc',q:'Du stehst am Stoppschild. Wer darf zuerst fahren?',
    vis:()=>crossing({veh:[{from:'S',kind:'bike',label:'Du'},{from:'W',kind:'car',label:'Auto',color:'#2b6fd6'}],signs:[{arm:'S',id:'stop'},{arm:'W',id:'vorfahrtstrasse'}]}),
    opts:['Das Auto','Du, weil das Auto von links kommt','Du, weil du zuerst da warst'],a:0,
    hint:'Schilder sind wichtiger als „rechts vor links".',ex:'Das Stoppschild gilt für dich. Du hältst an der Haltlinie an und lässt das Auto auf der Vorfahrtstraße vorbei – auch wenn es von links kommt.'},
  {type:'mc',q:'Du fährst auf der Vorfahrtstraße. Wer darf zuerst fahren?',
    vis:()=>crossing({veh:[{from:'S',kind:'bike',label:'Du'},{from:'E',kind:'car',label:'Auto',color:'#7a52c7'}],signs:[{arm:'S',id:'vorfahrtstrasse'},{arm:'E',id:'vorfahrtgewaehren'}]}),
    opts:['Du – aber du bleibst bremsbereit','Das Auto, weil es von rechts kommt','Das Auto, weil es größer ist'],a:0,
    hint:'Die gelbe Raute steht bei dir, das umgedrehte Dreieck beim Auto.',ex:'Du hast Vorfahrt, weil du auf der Vorfahrtstraße fährst. Das Auto muss warten. Schau trotzdem, ob der Fahrer dich gesehen hat (Blickkontakt) und sei bremsbereit.'},
  {type:'mc',q:'Du willst nach links abbiegen, das Auto kommt dir entgegen und fährt geradeaus. Wer fährt zuerst?',

    items:['Auto A','Du','Auto B'],
    hint:'Prüfe für jeden: Ist rechts von ihm jemand? Wer rechts frei hat, darf als Erster.',ex:'Auto A hat rechts von sich niemanden – es fährt zuerst. Du kommst für Auto B von rechts, also bist du vor Auto B dran. Auto B fährt als Letztes.'},
  {type:'order',q:'Wer bestimmt an einer Kreuzung am meisten? Ordne von „am wichtigsten" bis „gilt nur, wenn sonst nichts da ist".',
    items:['Polizist oder Polizistin','Ampel','Verkehrszeichen','Rechts vor links'],
    hint:'Ein Mensch, der den Verkehr regelt, ist wichtiger als jedes Licht.',ex:'Die Reihenfolge: Polizei vor Ampel, Ampel vor Schildern, Schilder vor „rechts vor links". Wenn ein Polizist den Verkehr regelt, gilt, was er zeigt – auch wenn die Ampel grün ist.'},
  {type:'mc',q:'Du fährst aus einer Garagen-Einfahrt oder vom Gehweg über den Bordstein auf die Straße. Wer hat Vorrang?',

    hint:'Hier gilt „rechts vor links" nicht.',ex:'Wer aus einer Einfahrt, vom Gehweg oder aus einem verkehrsberuhigten Bereich kommt, muss alle vorbeilassen. Am besten absteigen, schauen und erst fahren, wenn frei ist.'}
  ]},
{ id:5, title:'Das Abbiege-Labor', diff:'Schwer', dcls:'b4', icon:'radwarn', mx:[860,170],

  {type:'zones',q:'Der LKW will rechts abbiegen. Wo kann dich der Fahrer am schlechtesten sehen? Tippe auf den Bereich.',vis:()=>deadAngle(),a:'rechts',

let view='intro', run=null;
function stOf(id){return S.done[id]}
function unlocked(id){return id===1||!!S.done[id-1]}
function allDone(){return LEVELS.every(l=>S.done[l.id])}

function render(){
  if(!S.name&&view!=='intro')view='intro';
  if(view==='intro')renderIntro();
  else if(view==='map')renderMap();
  else if(view==='level')renderLevel();
  else if(view==='gate')renderGate();
  window.scrollTo({top:0});
}

function renderIntro(){
  app.innerHTML=`<section class="panel intro">
    <div>
      <div class="eyebrow">Ein Escape-Spiel zur Fahrradprüfung</div>
      <h1>Gefangen im <em>Verkehrsgarten!</em></h1>
      <p class="story">Freitagnachmittag im Verkehrsgarten: Du drehst noch eine letzte Übungsrunde für die Fahrradprüfung – da fällt das große Tor ins Schloss. Hausmeister Pedalo ist schon nach Hause gegangen.</p>
      <p class="story">Zum Glück hat er an sechs Stationen Rätsel versteckt. Jede gelöste Station verrät dir eine Ziffer des Tor-Codes. Knacke den Code – und hol dir deinen Fahrrad-Führerschein!</p>
      <form id="nameForm" class="namerow">
        <label for="nameIn" class="eyebrow" style="flex-basis:100%;color:var(--muted)">Wie heißt du?</label>
        <input id="nameIn" maxlength="24" autocomplete="off" placeholder="Dein Vorname" value="${esc(S.name)}">
        <button class="btn go" type="submit">Los geht's!</button>
      </form>
    </div>
    <div class="gateart">${gateSVG(false)}</div>
  </section>`;
  $('#nameForm').addEventListener('submit',e=>{e.preventDefault();const n=$('#nameIn').value.trim();if(!n){$('#nameIn').focus();$('#nameIn').placeholder='Bitte deinen Namen eintragen';return}S.name=n;save();sfx.ok();view='map';render()});
}

  const doneCount=Object.keys(S.done).length;
  const msg=doneCount===0?`Hallo ${esc(S.name)}! Ich bin Ringo, die Fahrradklingel. Fang bei Station 1 an – die Werkstatt ist gleich da vorne.`
    :allDone()?`Wahnsinn, ${esc(S.name)}! Du hast alle sechs Ziffern. Ab zum Tor und knack das Schloss!`
    :`Super, ${esc(S.name)}! ${doneCount} von 6 Stationen geschafft. Weiter geht's mit Station ${doneCount+1}.`;
  const pts=LEVELS.map(l=>l.mx);
  const gate=[930,110];
  app.innerHTML=`
  <div class="hello">${RINGO}<div class="bubble">${msg}</div></div>
  <div class="mapbox"><svg viewBox="0 0 1000 480" role="img" aria-label="Karte des Verkehrsgartens">
    <rect width="1000" height="480" style="fill:var(--grass)"/>
    ${[[60,60],[90,400],[250,90],[430,440],[600,180],[780,450],[960,300],[400,200],[820,80]].map(t=>`<g transform="translate(${t[0]} ${t[1]})"><circle r="26" style="fill:var(--grass-2)"/><circle cx="-8" cy="-8" r="14" style="fill:var(--grass)" opacity=".5"/></g>`).join('')}
    <path id="road" d="M40 470 C60 470 100 470 150 470 S 260 380 330 360 S 470 300 520 250 S 640 380 700 370 S 820 260 860 230 S 760 120 690 110 S 860 80 930 110" fill="none" style="stroke:var(--asphalt)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 470 C60 470 100 470 150 470 S 260 380 330 360 S 470 300 520 250 S 640 380 700 370 S 820 260 860 230 S 760 120 690 110 S 860 80 930 110" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="20 18" opacity=".9"/>
    ${LEVELS.map((l,k)=>{const u=unlocked(l.id),d=stOf(l.id),p=pts[k];return `<g class="st ${u?'':'locked'}" data-l="${l.id}" tabindex="${u?0:-1}" role="button" aria-label="Station ${l.id}: ${l.title}${u?'':' (gesperrt)'}">
      <g class="stc"><rect x="${p[0]-4}" y="${p[1]}" width="8" height="46" fill="#7d8890"/>
      <g transform="translate(${p[0]-38} ${p[1]-62}) scale(.76)" ${u?'':'opacity=".45"'}>${SIGNS[l.icon]}</g>
      <circle cx="${p[0]+30}" cy="${p[1]-58}" r="17" fill="${d?'#2b9a4d':u?'#fff':'#9aa6ae'}" stroke="#1c2a33" stroke-width="3"/>
      ${d?`<path d="M${p[0]+22} ${p[1]-58} l6 6 l11 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>`:u?`<text x="${p[0]+30}" y="${p[1]-52}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="18" fill="#1c2a33">${l.id}</text>`:`<g transform="translate(${p[0]+30} ${p[1]-58})"><path d="M-5 -2 v-4 a5 5 0 0 1 10 0 v4" stroke="#fff" stroke-width="2.5" fill="none"/><rect x="-7" y="-2" width="14" height="10" rx="2" fill="#fff"/></g>`}
      </g></g>`}).join('')}
    <g class="st ${allDone()?'':'locked'}" data-l="gate" tabindex="${allDone()?0:-1}" role="button" aria-label="Das Tor">
      <g class="stc"><g transform="translate(${gate[0]-46} ${gate[1]-70}) scale(.3)">${gateSVG(S.finished).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')}</g></g>
    </g>
    <text x="70" y="440" font-family="Fredoka,sans-serif" font-weight="700" font-size="20" fill="#fff">START</text>
  </svg></div>
  <div class="cards">${LEVELS.map(l=>{const u=unlocked(l.id),d=stOf(l.id);return `<button class="lcard" data-l="${l.id}" ${u?'':'disabled'}>
    ${sign(l.icon,'sg')}<span style="min-width:0"><span class="lm">Station ${l.id} · <span class="badge ${l.dcls}">${l.diff}</span></span><br><span class="lt">${l.title}</span><br>${d?starRow(d.stars):`<span class="lm">${u?'Bereit':'Noch gesperrt'}</span>`}</span></button>`}).join('')}</div>
  <div class="codebar"><span class="cl">Tor-Code:</span>${S.code.map((c,k)=>`<span class="digit ${S.done[k+1]?'got':''}">${S.done[k+1]?c:'?'}</span>`).join('')}
    <span style="flex:1"></span>${allDone()?`<button class="btn warn" id="toGate">Zum Tor</button>`:''}</div>`;
  app.querySelectorAll('[data-l]').forEach(el=>{
    const go=()=>{const v=el.dataset.l;if(v==='gate'){if(allDone()){view='gate';render()}return}const id=+v;if(!unlocked(id)){sfx.no();return}startLevel(id)};
    el.addEventListener('click',go);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
  });
  const tg=$('#toGate');if(tg)tg.onclick=()=>{view='gate';render()};
}

/* ============ Level-Ablauf ============ */
function startLevel(id){run={lvl:LEVELS[id-1],i:-1,mistakes:0,hearts:LEVELS[id-1].hearts||0};view='level';render()}

function renderLevel(){
  const L=run.lvl;
  if(run.i<0){
    app.innerHTML=`<section class="panel task">
      <div class="lhead"><span class="badge ${L.dcls}">Station ${L.id} · ${L.diff}</span></div>
      <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">${sign(L.icon,'bigsign')}<div style="flex:1 1 260px;min-width:0"><h2 style="font-size:clamp(26px,5vw,38px)">${L.title}</h2><p class="story">${L.story}</p><p class="lm" style="color:var(--muted);font-weight:700">${L.tasks.length} Rätsel</p></div></div>
      <div class="actions"><button class="btn go" id="startL">Rätsel starten</button><button class="btn ghost" id="backM">Zurück zur Karte</button></div>
    </section>`;
    $('#startL').onclick=()=>{run.i=0;render()};$('#backM').onclick=()=>{view='map';render()};
    return;
  }
  const t=L.tasks[run.i];
  app.innerHTML=`<div class="lhead"><button class="tbtn" id="backM">← Karte</button><h2>${L.title}</h2>${L.hearts?`<div class="hearts" id="hearts"></div>`:''}<span class="badge">Rätsel ${run.i+1} von ${L.tasks.length}</span></div>
  <div class="prog"><i style="width:${run.i/L.tasks.length*100}%"></i></div>
  <section class="panel task" id="task">
    ${L.parcours?parcMap(t.cp):''}
    <div class="q">${t.q}</div>
    ${t.vis?`<div class="vis">${t.vis()}</div>`:''}
    <div id="inter"></div>
    <div id="fb" hidden></div>
    <div class="actions"><button class="btn" id="nextB" hidden>Weiter</button><button class="tbtn" id="hintB"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Tipp von Ringo</button></div>
    <div id="hintBox" hidden></div>
  </section>`;
  $('#backM').onclick=()=>{view='map';render()};
  $('#hintB').onclick=()=>{const h=$('#hintBox');h.hidden=false;h.innerHTML=`<div class="ringo">${RINGO}<div class="bubble">${t.hint}</div></div>`;sfx.click()};
  $('#nextB').onclick=next;
  drawHearts();
  ({mc:doMC,multi:doMulti,order:doOrder,tf:doTF,zones:doZones})[t.type](t,$('#inter'));
}
function drawHearts(){const h=$('#hearts');if(h)h.innerHTML=[1,2,3].map(i=>HEART(i<=run.hearts)).join('')}
function good(ex){const f=$('#fb');f.hidden=false;f.className='fb good';f.innerHTML=`<b>${pick(['Richtig!','Super gemacht!','Klasse!','Genau so!','Stark!'])}</b>${ex}`;sfx.ok();$('#nextB').hidden=false;$('#nextB').textContent=run.i===run.lvl.tasks.length-1?'Station abschließen':'Weiter';$('#hintB').hidden=true;$('#hintBox').hidden=true;$('#nextB').focus({preventScroll:true});f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function bad(msg){const f=$('#fb');f.hidden=false;f.className='fb bad';f.innerHTML=`<b>${pick(['Nicht ganz!','Fast!','Hmm, noch mal!'])}</b>${msg||'Probier es noch einmal. Ringo hat einen Tipp für dich.'}`;sfx.no();run.mistakes++;
  if(run.lvl.hearts){run.hearts--;drawHearts();if(run.hearts<=0){setTimeout(failParcours,600)}}}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function next(){
  run.i++;
  if(run.i>=run.lvl.tasks.length){levelDone();return}
  if(run.lvl.parcours){moveBike(run.lvl.tasks[run.i].cp);setTimeout(render,900)}else render();
}

function doMC(t,box){
  const order=shuffle(t.opts.map((_,i)=>i));
  box.innerHTML=`<div class="opts ${t.pic?'':(t.opts.some(o=>(o.t||o).length>48)?'one':'')}">${order.map((i,k)=>{const o=t.opts[i];return t.pic
    ?`<button class="opt pic" data-i="${i}">${o.svg()}<span>${o.t}</span></button>`
    :`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[k]}</span><span>${o}</span></button>`}).join('')}</div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(i===t.a){b.classList.add('ok');box.querySelectorAll('.opt').forEach(x=>x.disabled=true);good(t.ex)}
    else{b.classList.add('no');b.disabled=true;bad(t.wrongMsg)}
  });
}
function doMulti(t,box){
  const order=shuffle(t.opts.map((_,i)=>i));
  box.innerHTML=`<div class="chips">${order.map(i=>`<button class="chip" data-i="${i}" aria-pressed="false">${t.opts[i]}</button>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="btn warn" id="chk">Prüfen</button></div>`;
  box.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{c.classList.toggle('on');c.classList.remove('no','miss');c.setAttribute('aria-pressed',c.classList.contains('on'));sfx.click()});
  $('#chk').onclick=()=>{
    const sel=[...box.querySelectorAll('.chip.on')].map(c=>+c.dataset.i);
    const wrong=sel.filter(i=>!t.a.includes(i)),miss=t.a.filter(i=>!sel.includes(i));
    if(!wrong.length&&!miss.length){box.querySelectorAll('.chip').forEach(c=>{c.disabled=true;if(c.classList.contains('on')){c.classList.remove('on');c.classList.add('ok')}});$('#chk').hidden=true;good(t.ex);return}
    wrong.forEach(i=>{const c=box.querySelector(`.chip[data-i="${i}"]`);c.classList.add('no')});
    let m=[];if(wrong.length)m.push(`${wrong.length} Teil${wrong.length>1?'e sind':' ist'} keine Pflicht (rot markiert).`);if(miss.length)m.push(`Es fehl${miss.length>1?'en':'t'} noch ${miss.length} Pflicht-Teil${miss.length>1?'e':''}.`);
    bad(m.join(' '));
  };
}
function doOrder(t,box){
  let pool=shuffle(t.items.map((_,i)=>i));
  if(pool.every((v,i)=>v===i))pool.reverse();
  let seq=[];
  const draw=()=>{
    box.innerHTML=`<div class="slots">${t.items.map((_,k)=>{const v=seq[k];return `<div class="slot ${v!==undefined?'filled':''}" data-k="${k}" ${v!==undefined?'role="button" tabindex="0" aria-label="Zurücklegen"':''}><span class="n">${k+1}</span><span class="t">${v!==undefined?t.items[v]:'<span style="color:var(--muted);font-weight:600">… tippe unten einen Schritt an</span>'}</span></div>`}).join('')}</div>
    <div class="pool" style="margin-top:12px">${pool.filter(i=>!seq.includes(i)).map(i=>`<button class="chip" data-i="${i}">${t.items[i]}</button>`).join('')}</div>
    <div class="actions" style="margin-top:14px"><button class="btn warn" id="chk" ${seq.length<t.items.length?'disabled':''}>Prüfen</button><button class="tbtn" id="clr">Alles zurück</button></div>`;
    box.querySelectorAll('.pool .chip').forEach(c=>c.onclick=()=>{seq.push(+c.dataset.i);sfx.click();draw()});
    box.querySelectorAll('.slot.filled').forEach(s=>{const f=()=>{seq.splice(+s.dataset.k);draw()};s.onclick=f;s.onkeydown=e=>{if(e.key==='Enter')f()}});
    $('#clr').onclick=()=>{seq=[];draw()};
    $('#chk').onclick=()=>{
      const firstWrong=seq.findIndex((v,k)=>v!==k);
      if(firstWrong<0){box.querySelectorAll('.slot').forEach(s=>{s.classList.add('ok');s.onclick=null});box.querySelector('.actions').hidden=true;good(t.ex);return}
      box.querySelectorAll('.slot').forEach((s,k)=>{if(k<firstWrong)s.classList.add('ok');else if(k===firstWrong)s.classList.add('no')});
      bad(`Bis Schritt ${firstWrong} stimmt alles. Ab Schritt ${firstWrong+1} passt die Reihenfolge noch nicht. Tippe auf einen Schritt, um ihn zurückzulegen.`);
      const keep=seq.slice(0,firstWrong);setTimeout(()=>{if(box.isConnected){seq=keep;draw()}},1700);
    };
  };
  draw();
}
function doTF(t,box){
  const solved=new Set();
  box.innerHTML=`<div class="tf">${t.items.map((it,k)=>`<div class="tfrow" data-k="${k}"><p>${it.s}</p><div class="tfb"><button data-v="1">Wahr</button><button data-v="0">Falsch</button></div><small hidden></small></div>`).join('')}</div>`;
  box.querySelectorAll('.tfrow').forEach(r=>{const k=+r.dataset.k,it=t.items[k];
    r.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const v=b.dataset.v==='1';const correct=it.a;
      if(v===correct){r.classList.remove('no');r.classList.add('ok');r.querySelector('.tfb').remove();const s=r.querySelector('small');s.hidden=false;s.textContent=it.ex;solved.add(k);sfx.ok();
        $('#fb').hidden=true;if(solved.size===t.items.length)good('Alle Sätze richtig entschieden!')}
      else{r.classList.add('no');bad('Dieser Satz stimmt so nicht – denk noch mal nach.')}
    });
  });
}
function doZones(t,box){
  const zs=document.querySelectorAll('#task .vis .hz');
  let doneZ=false;
  zs.forEach(z=>{const f=()=>{if(doneZ)return;const id=z.dataset.zone;
    if(id===t.a){doneZ=true;z.style.filter='drop-shadow(0 0 6px #2b9a4d) drop-shadow(0 0 3px #2b9a4d)';good(t.ex)}
    else bad((t.wrong&&t.wrong[id])||'Das ist es nicht. Schau noch mal genau hin.')};
    z.addEventListener('click',f);z.setAttribute('tabindex','0');z.setAttribute('role','button');z.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}})});
  box.innerHTML='';
}
function failParcours(){
  overlay(`<div class="ovc"><div style="width:90px;margin:0 auto">${RINGO}</div><h2>Abgepfiffen!</h2><p>Der Prüfer hebt die Kelle: Alle Herzen sind weg. Kein Problem – Übung macht den Profi! Lies im Lernbuch nach und fahre den Parcours noch einmal.</p><div class="actions" style="justify-content:center"><button class="btn go" id="again">Parcours neu starten</button><button class="btn ghost" id="obook">Lernbuch öffnen</button></div></div>`);
  $('#again').onclick=()=>{closeOv();startLevel(6)};$('#obook').onclick=()=>{closeOv();view='map';render();openBook('s6')};
}
function levelDone(){
  const L=run.lvl,m=run.mistakes;
  const stars=L.hearts?(m===0?3:m===1?2:1):(m<=1?3:m<=3?2:1);
  const prev=S.done[L.id];S.done[L.id]={stars:Math.max(stars,prev?prev.stars:0)};save();
  sfx.win();confetti();
  overlay(`<div class="ovc"><div class="eyebrow">Station ${L.id} geschafft</div><h2>${L.title} gelöst!</h2>
    <div class="bigstars">${[1,2,3].map(i=>STAR(i<=stars)).join('')}</div>
    <p>${m===0?'Ohne einen einzigen Fehler!':m===1?'Nur ein kleiner Fehler!':`${m} Fehler – beim nächsten Mal schaffst du mehr Sterne.`} Hinter dem Schloss klebt ein Zettel mit einer Ziffer:</p>
    <div class="bigdigit">${S.code[L.id-1]}</div>
    <p style="color:var(--muted);font-weight:700">Das ist Ziffer Nr. ${L.id} des Tor-Codes. Sie steht jetzt unten auf deiner Karte.</p>
    <div class="actions" style="justify-content:center"><button class="btn go" id="toMap">${allDone()?'Weiter zum Tor':'Zur Karte'}</button>${stars<3?'<button class="btn ghost" id="retry">Noch mal für 3 Sterne</button>':''}</div></div>`);
  $('#toMap').onclick=()=>{closeOv();view=allDone()?'gate':'map';render()};
  const r=$('#retry');if(r)r.onclick=()=>{closeOv();startLevel(L.id)};
}

/* ============ Tor ============ */
function renderGate(){
  let vals=[0,0,0,0,0,0];
  app.innerHTML=`<section class="panel" style="text-align:center">
    <div class="eyebrow">Das große Tor</div><h2 style="font-size:clamp(28px,5vw,40px)">Knacke das Zahlenschloss!</h2>
    <p>Stelle die sechs Ziffern in der Reihenfolge der Stationen 1 bis 6 ein.</p>
    <div style="max-width:300px;margin:0 auto" id="gateArt">${gateSVG(false)}</div>
    <div class="lock" id="lock">${vals.map((v,k)=>`<div class="wheel"><button data-k="${k}" data-d="1" aria-label="Ziffer ${k+1} hoch">▲</button><div class="wd" id="wd${k}" aria-live="polite">0</div><button data-k="${k}" data-d="-1" aria-label="Ziffer ${k+1} runter">▼</button></div>`).join('')}</div>
    <div class="actions" style="justify-content:center"><button class="btn warn" id="open">Schloss öffnen</button><button class="btn ghost" id="backM">Zur Karte</button></div>
    <p id="gmsg" style="font-weight:700;min-height:1.5em"></p>
    <div class="codebar" style="justify-content:center"><span class="cl">Deine Zettel:</span>${S.code.map((c,k)=>`<span class="digit got" title="Station ${k+1}">${c}</span>`).join('')}</div>
  </section>`;
  app.querySelectorAll('.wheel button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;vals[k]=(vals[k]+(+b.dataset.d)+10)%10;$('#wd'+k).textContent=vals[k];sfx.click()});
  $('#backM').onclick=()=>{view='map';render()};
  $('#open').onclick=()=>{
    if(vals.every((v,k)=>v===S.code[k])){S.finished=true;save();$('#gateArt').innerHTML=gateSVG(true);sfx.win();confetti();confetti();$('#gmsg').textContent='Klick! Das Tor schwingt auf …';setTimeout(showCert,1500)}
    else{const l=$('#lock');l.classList.remove('shake');void l.offsetWidth;l.classList.add('shake');sfx.no();$('#gmsg').textContent='Das Schloss bleibt zu. Vergleiche mit deinen Zetteln unten.'}
  };
}
function showCert(){
  const total=Object.values(S.done).reduce((a,b)=>a+b.stars,0);
  const d=new Date().toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});
  const canPrint=window.self===window.top;
  overlay(`<div class="ovc" style="max-width:720px"><div class="cert">
    <div class="seal">${sign('radweg')}</div>
    <h2>Fahrrad-Führerschein</h2><div class="eyebrow" style="color:#2b9a4d">Übungs-Urkunde aus dem Verkehrsgarten</div>
    <p style="margin-top:14px">Hiermit wird bestätigt, dass</p><div class="nm">${esc(S.name)}</div>
    <p>alle sechs Stationen gelöst, den Tor-Code geknackt und damit gezeigt hat, dass sie oder er die Regeln für die Fahrradprüfung kennt.</p>
    <div class="bigstars">${STAR(true)}<span class="disp" style="font-size:30px;align-self:center">${total} / 18 Sterne</span></div>
    <p><small>Verkehrsgarten, am ${d} · gezeichnet: Hausmeister Pedalo &amp; Ringo, die Fahrradklingel</small></p>
    <p><small>Viel Erfolg bei der echten Prüfung mit der Polizei!</small></p>
  </div>
  <div class="actions noprint" style="justify-content:center;margin-top:16px">${canPrint?'<button class="btn" id="prt">Urkunde drucken</button>':''}<button class="btn go" id="cmap">Zur Karte</button></div>
  ${canPrint?'':'<p class="noprint" style="color:var(--muted);font-size:14px">Tipp: Mach ein Bildschirmfoto von deiner Urkunde.</p>'}</div>`);
  const p=$('#prt');if(p)p.onclick=()=>window.print();
  $('#cmap').onclick=()=>{closeOv();view='map';render()};
}

/* ============ Overlay, Konfetti ============ */
function overlay(html){const r=$('#ovRoot');r.innerHTML=`<div class="ov" role="dialog" aria-modal="true">${html}</div>`;const b=r.querySelector('button');if(b)b.focus()}
function closeOv(){$('#ovRoot').innerHTML=''}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#d7312f','#1d5fc4','#ffc72c','#2b9a4d','#fff'];for(let i=0;i<60;i++){const c=document.createElement('div');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%5];c.style.animationDuration=(1.6+Math.random()*1.8)+'s';c.style.animationDelay=Math.random()*.4+'s';c.style.borderRadius=i%3?'2px':'50%';document.body.appendChild(c);setTimeout(()=>c.remove(),4200)}}

/* ============ Lernbuch ============ */
function openBook(anchor){
  const sg=(id,t)=>`<figure>${sign(id)}${t}</figure>`;
  overlay(`<div class="ovc book"><button class="tbtn closex" id="cb">Schließen ✕</button><div class="eyebrow">Zum Nachlesen und Lernen</div><h2>Ringos Lernbuch</h2>
  <nav class="booknav"><a href="#s1">Fahrrad</a><a href="#s2">Schilder</a><a href="#s3">Handzeichen</a><a href="#s4">Vorfahrt</a><a href="#s5">Abbiegen</a><a href="#s6">Prüfung</a><a href="#s7">Regeln</a></nav>
  <h3 id="s1">1. Das verkehrssichere Fahrrad</h3>
  <ul><li><b>Zwei Bremsen</b>, die unabhängig voneinander funktionieren (vorne und hinten).</li><li><b>Klingel</b>, die hell klingt.</li><li><b>Vorne:</b> weißer Scheinwerfer und weißer Rückstrahler.</li><li><b>Hinten:</b> rotes Rücklicht und roter Rückstrahler.</li><li><b>Pedale:</b> gelbe Rückstrahler.</li><li><b>Seite:</b> gelbe Speichen-Reflektoren (2 pro Rad) oder weiße Reflexstreifen an den Reifen.</li></ul>
  <p>Der <b>Helm</b> ist keine Pflicht, schützt aber deinen Kopf. Er sitzt gerade, zwei Finger über den Augenbrauen, der Kinnriemen ist zu. Helle Kleidung hilft dir, gesehen zu werden.</p>
  <h3 id="s2">2. Wichtige Verkehrszeichen</h3>
  <p>Dreieck mit rotem Rand = <b>Warnung</b>. Runder roter Rand = <b>Verbot</b>. Rund und blau = <b>Gebot</b> (das musst du tun).</p>
  <div class="signgrid">${sg('stop','Halt! Vorfahrt gewähren')}${sg('vorfahrtgewaehren','Vorfahrt gewähren')}${sg('vorfahrtstrasse','Vorfahrtstraße')}${sg('endevorfahrt','Ende der Vorfahrtstraße')}${sg('vorfahrtnaechste','Vorfahrt an der nächsten Kreuzung')}${sg('rechtsvorlinks','Kreuzung: rechts vor links')}${sg('gefahr','Gefahrstelle')}${sg('radweg','Radweg')}${sg('gehweg','Gehweg')}${sg('gemeinsam','Gemeinsamer Geh- und Radweg')}${sg('getrennt','Getrennter Rad- und Gehweg')}${sg('verbotrad','Verbot für Radfahrer')}${sg('verbotalle','Verbot für Fahrzeuge aller Art')}${sg('einfahrt','Verbot der Einfahrt')}${sg('einbahn','Einbahnstraße, Radfahrer frei')}${sg('zebra','Fußgängerüberweg (Zebrastreifen)')}${sg('sackgasse','Sackgasse')}</div>
  <h3 id="s3">3. Handzeichen und Schulterblick</h3>
  <ul><li>Links abbiegen: <b>linken Arm</b> waagrecht ausstrecken. Rechts abbiegen: <b>rechten Arm</b>.</li><li>Das Zeichen gibst du <b>rechtzeitig vorher</b>. Beim Abbiegen sind beide Hände am Lenker.</li><li><b>Schulterblick</b> (über die Schulter nach hinten schauen) vor dem Anfahren, Abbiegen, Vorbeifahren und Einordnen.</li></ul>
  <p><b>Anfahren vom Fahrbahnrand:</b> Pedal hochstellen → Schulterblick links → Handzeichen links → noch mal schauen → losfahren und rechts fahren.</p>
  <p><b>Vorbeifahren an einem Hindernis:</b> Schulterblick links → Handzeichen links → mit etwa 1 m Abstand vorbei → wieder rechts einordnen.</p>
  <h3 id="s4">4. Wer hat Vorfahrt?</h3>
  <ol><li>Polizist oder Polizistin</li><li>Ampel</li><li>Verkehrszeichen</li><li>Rechts vor links</li></ol>
  <p>Wer aus einer Einfahrt, vom Gehweg oder über einen abgesenkten Bordstein auf die Straße fährt, lässt <b>alle</b> vorbei. Wer links abbiegt, lässt den <b>Gegenverkehr</b> durch. Beim Abbiegen haben <b>Fußgänger</b> Vorrang.</p>
  <h3 id="s5">5. Abbiegen und toter Winkel</h3>
  <p><b>Rechts abbiegen:</b> Schulterblick → Handzeichen rechts → bremsbereit heranfahren, Fußgänger beachten → in engem Bogen abbiegen.</p>
  <p><b>Direkt links abbiegen:</b> Schulterblick links → Handzeichen links → zur Mitte einordnen → Gegenverkehr durchlassen → noch einmal Schulterblick → abbiegen.</p>
  <p><b>Indirekt links abbiegen</b> (bei viel Verkehr): rechts bleiben, geradeaus über die Kreuzung bis zur Ecke, anhalten, Rad in die neue Richtung stellen, bei Grün oder wenn frei geradeaus weiterfahren. Absteigen und schieben ist auch erlaubt.</p>
  <p><b>Toter Winkel:</b> Rechts neben einem LKW oder Bus sieht dich der Fahrer nicht. Fahre nie rechts an einem abbiegenden LKW vorbei. Bleib dahinter.</p>
  <h3 id="s6">6. So läuft die Radfahrprüfung</h3>
  <p>In der 4. Klasse übst du mit der Polizei in der Jugendverkehrsschule oder im Schonraum. Es gibt eine <b>theoretische Prüfung</b> (Fragebogen zu Regeln, Schildern und Vorfahrt) und eine <b>praktische Prüfung</b> (Fahren im Verkehr oder auf dem Übungsplatz). Die Prüfer achten besonders auf:</p>
  <ul><li>Schulterblick und Handzeichen zur richtigen Zeit</li><li>richtiges Einordnen und Abbiegen</li><li>Vorfahrt beachten, am Stoppschild ganz anhalten</li><li>sicheres Fahren: rechts fahren, Abstand halten, bremsbereit sein</li><li>ein verkehrssicheres Fahrrad und einen gut sitzenden Helm</li></ul>
  <h3 id="s7">7. Wichtige Regeln</h3>
  <ul><li>Bis 8 Jahre musst du auf dem Gehweg fahren, bis 10 Jahre darfst du es. Ab 10 fährst du auf dem Radweg oder der Straße.</li><li>Ist ein Radweg mit blauem Schild da, musst du ihn benutzen.</li><li>Auf der Straße fährst du möglichst weit rechts.</li><li>Freihändig fahren und Anhängen an Fahrzeuge sind verboten.</li><li>Am Zebrastreifen steigst du ab und schiebst.</li><li>Bei Dämmerung und Dunkelheit muss das Licht an sein.</li><li>Handy weg beim Fahren.</li></ul>
  <div class="actions" style="justify-content:center;margin-top:18px"><button class="btn go" id="cb2">Weiterspielen</button></div></div>`);
  $('#cb').onclick=closeOv;$('#cb2').onclick=closeOv;
  document.querySelectorAll('.booknav a').forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById(a.getAttribute('href').slice(1));if(el)el.scrollIntoView({behavior:'smooth'})});
  if(anchor)setTimeout(()=>{const el=document.getElementById(anchor);if(el)el.scrollIntoView()},50);
}

/* ============ Start ============ */
$('#homeBtn').onclick=()=>{closeOv();view=S.name?'map':'intro';render()};
$('#bookBtn').onclick=()=>openBook();
$('#soundBtn').onclick=()=>{S.muted=!S.muted;save();updSound();sfx.click()};
let resetArmed=false;
$('#resetBtn').onclick=()=>{const b=$('#resetBtn');if(!resetArmed){resetArmed=true;b.textContent='Wirklich alles löschen? Noch mal tippen';setTimeout(()=>{resetArmed=false;b.textContent='Neues Spiel starten'},4000);return}S=freshState();save();resetArmed=false;b.textContent='Neues Spiel starten';closeOv();view='intro';render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.ovc.book'))closeOv()});
updSound();
view=S.name?'map':'intro';
render();
</script>
