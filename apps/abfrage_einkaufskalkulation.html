<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mündliche Abfrage – Einkaufskalkulation</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
    colors: { navy: { 50:'#eef2f8', 100:'#d9e1ee', 200:'#b3c3dd', 500:'#2f4f86', 600:'#1f3c6e', 700:'#172f57', 800:'#112342', 900:'#0b172c' } }
  } }
}
</script>
<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  body { touch-action: manipulation; }
  .tab { font-variant-numeric: tabular-nums; }
  .fade { animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  input[type=text] { font-size: 1.25rem; }
</style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen">

<!-- Kopfzeile -->
<header class="bg-navy-800 text-white">
  <div class="max-w-4xl mx-auto px-5 py-4 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <svg viewBox="0 0 48 48" class="w-10 h-10 shrink-0" aria-hidden="true">
        <rect x="1.5" y="1.5" width="45" height="45" rx="12" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".9"/>
        <path d="M8 36 L19 18 L25 27 L30 20 L40 36 Z" fill="currentColor" opacity=".9"/>
        <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".9">
          <path d="M35 8 v8 M31 12 h8 M32.2 9.2 l5.6 5.6 M37.8 9.2 l-5.6 5.6"/>
        </g>
      </svg>
      <div>
        <div class="text-lg font-bold leading-tight">SnowPro <span class="font-medium text-navy-200">Max Winter e. K.</span></div>
        <div class="text-xs text-navy-200">Mündliche Abfrage BwR · Einkaufskalkulation</div>
      </div>
    </div>
    <div id="headInfo" class="text-right text-sm text-navy-100 hidden">
      <div id="headName" class="font-semibold"></div>
      <div id="headStep" class="text-navy-200 tab"></div>
    </div>
  </div>
  <div class="h-1.5 bg-navy-900"><div id="progress" class="h-full bg-sky-400 transition-all duration-300" style="width:0%"></div></div>
</header>

<main id="app" class="max-w-4xl mx-auto px-5 py-8"></main>

<script>
/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const r2 = n => Math.round(n * 100) / 100;
const eur = n => (isFinite(n) ? n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €' : '–');
function parseNum(str) {
  if (str == null) return NaN;
  let s = String(str).replace(/€|eur|\s/gi, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}
const eq = (a, b) => isFinite(a) && isFinite(b) && Math.abs(a - b) < 0.015;
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

/* ---------- Rahmenhandlung ---------- */
const FALL = {
  stueck: 40, preis: 85, lep: 3400, rabattPct: 15, skontoPct: 2, fracht: 150, versicherung: 37.80
};
const fallBox = (extra = '') => `
  <div class="rounded-2xl bg-sky-50 border border-sky-200 p-5 mb-6">
    <div class="text-xs font-semibold uppercase tracking-wider text-sky-700 mb-2">Situation</div>
    <p class="text-lg leading-relaxed">SnowPro bestellt bei der <b>Bindungswerk Alpin GmbH</b> in Rosenheim
    <b>${FALL.stueck} Snowboard-Bindungen</b> zu je <b class="tab">${eur(FALL.preis)}</b> netto.
    Der Lieferer gewährt <b>${FALL.rabattPct} % Liefererrabatt</b> und bei Zahlung innerhalb von 10 Tagen
    <b>${FALL.skontoPct} % Liefererskonto</b>.${extra}</p>
  </div>`;

/* ---------- Aufgaben (Theorie und Rechnen im Wechsel) ---------- */
const SCHEMA = ['Listeneinkaufspreis', 'Liefererrabatt', 'Zieleinkaufspreis', 'Liefererskonto', 'Bareinkaufspreis', 'Bezugskosten', 'Einstandspreis'];

const AUFGABEN = [
  { id: 'schema', art: 'Theorie', typ: 'order', max: 2,
    titel: 'Kalkulationsschema',
    frage: 'Vervollständige das Schema der Einkaufskalkulation, indem du die Positionen in der richtigen Reihenfolge antippst.',
    hinweis: 'Tippe auf eine bereits gesetzte Position, um sie wieder zu entfernen.',
    regel: '7 Positionen richtig: 2 Punkte · 5–6 richtig: 1 Punkt · sonst 0 Punkte' },

  { id: 'rabatt', art: 'Rechnen', typ: 'calc', max: 2,
    titel: 'Liefererrabatt',
    frage: 'Ermittle den Liefererrabatt in € und den Zieleinkaufspreis für die gesamte Lieferung.',
    felder: [ { key: 'rabatt', label: 'Liefererrabatt' }, { key: 'zep', label: 'Zieleinkaufspreis' } ],
    regel: 'je richtiger Betrag 1 Punkt; Zieleinkaufspreis wird auch mit dem eigenen (falschen) Rabatt als richtig gewertet (Folgefehler)',
    vorspann: () => `<div class="mb-4 text-slate-600">Listeneinkaufspreis: <b class="tab text-slate-800">${FALL.stueck} ∙ ${eur(FALL.preis)} = ${eur(FALL.lep)}</b></div>` },

  { id: 'unterschied', art: 'Theorie', typ: 'multi', max: 2,
    titel: 'Rabatt oder Skonto?',
    regel: 'je richtige Auswahl 1 Punkt, je falsche Auswahl 1 Punkt Abzug, mindestens 0 Punkte',
    frage: 'Unterscheide Liefererrabatt und Liefererskonto, indem du die <b>zwei</b> zutreffenden Aussagen auswählst.',
    optionen: [
      { t: 'Der Liefererskonto ist ein Preisnachlass für die Zahlung innerhalb einer vereinbarten Frist.', ok: true },
      { t: 'Der Liefererskonto wird immer vom Listeneinkaufspreis berechnet.', ok: false },
      { t: 'Einen Liefererrabatt gewährt der Lieferer z. B. für große Bestellmengen oder treue Kunden.', ok: true },
      { t: 'Einen Liefererrabatt erhält SnowPro nur, wenn die Rechnung sofort bezahlt wird.', ok: false }
    ] },

  { id: 'skonto', art: 'Rechnen', typ: 'calc', max: 2,
    titel: 'Liefererskonto',
    frage: 'SnowPro zahlt innerhalb der Skontofrist. Ermittle den Liefererskonto in € und den Bareinkaufspreis.',
    felder: [ { key: 'skonto', label: 'Liefererskonto' }, { key: 'bep', label: 'Bareinkaufspreis' } ],
    regel: 'je richtiger Betrag 1 Punkt; Rechnung mit dem eigenen Zieleinkaufspreis aus Aufgabe 2 wird als richtig gewertet (Folgefehler)',
    vorspann: () => `<div class="mb-4 text-slate-600">Dein Zieleinkaufspreis aus Aufgabe 2: <b class="tab text-slate-800">${isFinite(parseNum(ANT.rabatt?.zep)) ? eur(parseNum(ANT.rabatt.zep)) : '–'}</b></div>` },

  { id: 'bezug', art: 'Theorie', typ: 'sort', max: 2,
    titel: 'Bezugskosten',
    regel: '6 Zuordnungen richtig: 2 Punkte · 4–5 richtig: 1 Punkt · sonst 0 Punkte',
    frage: 'Ordne zu: Gehören die folgenden Kosten zu den Bezugskosten der Bindungen?',
    items: [
      { t: 'Fracht des Spediteurs', ok: true },
      { t: 'Umsatzsteuer (Vorsteuer) auf die Rechnung', ok: false },
      { t: 'Transportversicherung', ok: true },
      { t: 'Miete für das eigene Lager von SnowPro', ok: false },
      { t: 'Rollgeld für die Anlieferung', ok: true },
      { t: 'Liefererskonto', ok: false }
    ] },

  { id: 'einstand', art: 'Rechnen', typ: 'calc', max: 2,
    titel: 'Einstandspreis',
    frage: 'Für den Transport stellt der Spediteur <b class="tab">150,00 €</b> Fracht in Rechnung, die Transportversicherung kostet <b class="tab">37,80 €</b>. Ermittle den Einstandspreis für die gesamte Lieferung und für eine Bindung.',
    felder: [ { key: 'ep', label: 'Einstandspreis gesamt' }, { key: 'eps', label: 'Einstandspreis je Bindung' } ],
    regel: 'je richtiger Betrag 1 Punkt; Rechnung mit dem eigenen Bareinkaufspreis aus Aufgabe 4 wird als richtig gewertet (Folgefehler)',
    vorspann: () => `<div class="mb-4 text-slate-600">Dein Bareinkaufspreis aus Aufgabe 4: <b class="tab text-slate-800">${isFinite(parseNum(ANT.skonto?.bep)) ? eur(parseNum(ANT.skonto.bep)) : '–'}</b></div>` },

  { id: 'begruendung', art: 'Theorie', typ: 'teacher', max: 2,
    titel: 'Angebotsvergleich',
    frage: 'Max Winter möchte künftig einfach beim Lieferer mit dem niedrigsten Listeneinkaufspreis bestellen. Begründe, warum das nicht sinnvoll ist.',
    hinweis: 'Antworte mündlich.',
    regel: 'mündliche Antwort, je Aspekt des Erwartungshorizonts 1 Punkt (Bewertung durch die Lehrkraft)',
    erwartung: [
      'Liefererrabatt, Liefererskonto und Bezugskosten können je Lieferer unterschiedlich hoch sein. (1)',
      'Erst der Einstandspreis zeigt, was die Ware SnowPro tatsächlich kostet; Angebote vergleicht man daher über den Einstandspreis. (1)'
    ] }
];
const MAX = AUFGABEN.reduce((s, a) => s + a.max, 0);

/* Notenschlüssel Standard (Skill): 87 / 73 / 60 / 46 / 32 % */
const SCHLUESSEL = [ [1, 0.87], [2, 0.73], [3, 0.60], [4, 0.46], [5, 0.32], [6, 0] ];
const grenze = p => Math.ceil(p * MAX * 2) / 2;
const note = pkt => { for (const [n, p] of SCHLUESSEL) if (pkt >= grenze(p)) return n; return 6; };

/* ---------- Zustand ---------- */
let SCHUELER = { name: '', klasse: '' };
let ANT = {};
let OVERRIDE = {};
let BEMERKUNG = '';
/* Zeiterfassung je Aufgabe – nur für die PDF-Dokumentation */
let ZEIT = {}, AUFRUFE = {}, aktivStep = null, stepStart = 0;
function zeitErfassen() {
  if (aktivStep != null && AUFGABEN[aktivStep]) {
    const id = AUFGABEN[aktivStep].id;
    ZEIT[id] = (ZEIT[id] || 0) + (Date.now() - stepStart);
  }
  aktivStep = null;
}
const dauer = ms => { const s = Math.round((ms || 0) / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} min`; };
let step = -1;
let orderPool = [];

/* ---------- Bewertung (mit Folgefehlern) ---------- */
function bewerte() {
  const res = {};
  // 1 Schema
  { const seq = ANT.schema || []; const richtig = SCHEMA.filter((s, i) => seq[i] === s).length;
    res.schema = { p: richtig === 7 ? 2 : richtig >= 5 ? 1 : 0, info: `${richtig} von 7 Positionen an der richtigen Stelle` }; }
  // 2 Rabatt
  { const a = ANT.rabatt || {}; const rab = parseNum(a.rabatt), zep = parseNum(a.zep);
    const pR = eq(rab, 510) ? 1 : 0;
    const pZ = (eq(zep, 2890) || (isFinite(rab) && eq(zep, r2(FALL.lep - rab)))) ? 1 : 0;
    res.rabatt = { p: pR + pZ, info: `Rabatt ${pR ? '✓' : '✗'} · ZEP ${pZ ? '✓' : '✗'}${pZ && !eq(zep, 2890) ? ' (Folgefehler berücksichtigt)' : ''}`,
      soll: 'Rabatt 510,00 € · ZEP 2.890,00 €',
      zeilen: [ ['Liefererrabatt', a.rabatt, '510,00 €', pR], ['Zieleinkaufspreis', a.zep, '2.890,00 €', pZ, pZ && !eq(zep, 2890)] ] }; }
  // 3 Multiple Choice
  { const sel = ANT.unterschied || []; const opt = AUFGABEN[2].optionen;
    const r = sel.filter(i => opt[i].ok).length, f = sel.filter(i => !opt[i].ok).length;
    res.unterschied = { p: Math.max(0, r - f), info: `${r} richtige, ${f} falsche Auswahl` }; }
  // 4 Skonto (Basis: eigener ZEP)
  { const zepS = parseNum(ANT.rabatt?.zep); const a = ANT.skonto || {}; const sk = parseNum(a.skonto), bep = parseNum(a.bep);
    const pS = (eq(sk, 57.80) || (isFinite(zepS) && eq(sk, r2(zepS * 0.02)))) ? 1 : 0;
    const pB = (eq(bep, 2832.20) || (isFinite(zepS) && isFinite(sk) && eq(bep, r2(zepS - sk)))) ? 1 : 0;
    const folge = (pS && !eq(sk, 57.80)) || (pB && !eq(bep, 2832.20));
    res.skonto = { p: pS + pB, info: `Skonto ${pS ? '✓' : '✗'} · BEP ${pB ? '✓' : '✗'}${folge ? ' (Folgefehler berücksichtigt)' : ''}`,
      soll: 'Skonto 57,80 € · BEP 2.832,20 €',
      zeilen: [ ['Liefererskonto', a.skonto, '57,80 €', pS, pS && !eq(sk, 57.80)], ['Bareinkaufspreis', a.bep, '2.832,20 €', pB, pB && !eq(bep, 2832.20)] ] }; }
  // 5 Bezugskosten
  { const z = ANT.bezug || {}; const items = AUFGABEN[4].items;
    const r = items.filter((it, i) => z[i] === it.ok).length;
    res.bezug = { p: r === 6 ? 2 : r >= 4 ? 1 : 0, info: `${r} von 6 richtig zugeordnet`, soll: 'Ja: Fracht, Transportversicherung, Rollgeld' }; }
  // 6 Einstandspreis (Basis: eigener BEP)
  { const bepS = parseNum(ANT.skonto?.bep); const a = ANT.einstand || {}; const ep = parseNum(a.ep), eps = parseNum(a.eps);
    const pE = (eq(ep, 3020) || (isFinite(bepS) && eq(ep, r2(bepS + 187.80)))) ? 1 : 0;
    const pS = (eq(eps, 75.50) || (isFinite(ep) && eq(eps, r2(ep / FALL.stueck)))) ? 1 : 0;
    const folge = (pE && !eq(ep, 3020)) || (pS && !eq(eps, 75.50));
    res.einstand = { p: pE + pS, info: `EP gesamt ${pE ? '✓' : '✗'} · EP je Stück ${pS ? '✓' : '✗'}${folge ? ' (Folgefehler berücksichtigt)' : ''}`,
      soll: 'EP 3.020,00 € · je Bindung 75,50 €',
      zeilen: [ ['Einstandspreis gesamt', a.ep, '3.020,00 €', pE, pE && !eq(ep, 3020)], ['Einstandspreis je Bindung', a.eps, '75,50 €', pS, pS && !eq(eps, 75.50)] ] }; }
  // 7 Lehrkraft
  res.begruendung = { p: ANT.begruendung ?? 0, info: 'Bewertung durch Lehrkraft' };
  // Korrekturen der Lehrkraft
  for (const k in OVERRIDE) if (res[k]) { res[k].auto = res[k].p; res[k].p = OVERRIDE[k]; }
  return res;
}

/* ---------- Rendering ---------- */
function setProgress() {
  const pct = step < 0 ? 0 : step >= AUFGABEN.length ? 100 : (step / AUFGABEN.length) * 100;
  $('#progress').style.width = pct + '%';
  $('#headInfo').classList.toggle('hidden', step < 0);
  $('#headName').textContent = SCHUELER.name + (SCHUELER.klasse ? ' · ' + SCHUELER.klasse : '');
  $('#headStep').textContent = step < AUFGABEN.length ? `Aufgabe ${step + 1} von ${AUFGABEN.length}` : 'Auswertung';
}

function renderStart() {
  zeitErfassen();
  step = -1; setProgress();
  $('#app').innerHTML = `
  <div class="fade bg-white rounded-3xl shadow-sm border border-slate-200 p-8 md:p-10">
    <div class="text-sm font-semibold uppercase tracking-wider text-navy-500 mb-2">Mündliche Abfrage</div>
    <h1 class="text-3xl md:text-4xl font-extrabold text-navy-800 mb-3">Einkaufskalkulation</h1>
    <p class="text-slate-600 text-lg mb-8">Du hilfst Max Winter beim Einkauf von Snowboard-Bindungen. Es erwarten dich ${AUFGABEN.length} kurze Aufgaben – Theorie und Rechnen im Wechsel.</p>
    <div class="grid sm:grid-cols-3 gap-4 mb-8">
      <label class="sm:col-span-2 block">
        <span class="text-sm font-medium text-slate-600">Name</span>
        <input id="inName" type="text" autocomplete="off" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-4 focus:ring-sky-200 focus:border-sky-500" value="${esc(SCHUELER.name)}">
      </label>
      <label class="block">
        <span class="text-sm font-medium text-slate-600">Klasse</span>
        <input id="inKlasse" type="text" autocomplete="off" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-4 focus:ring-sky-200 focus:border-sky-500" value="${esc(SCHUELER.klasse)}">
      </label>
    </div>
    <ul class="text-slate-600 space-y-2 mb-8">
      <li class="flex gap-3"><span class="text-sky-600 font-bold">›</span>Beträge kannst du mit oder ohne „€“ eingeben, z. B. <span class="tab font-medium">1.234,56</span>.</li>
      <li class="flex gap-3"><span class="text-sky-600 font-bold">›</span>Mit „Zurück“ kannst du Antworten noch ändern, bis du die Abfrage abschließt.</li>
    </ul>
    <button id="btnStart" class="w-full sm:w-auto rounded-2xl bg-navy-700 hover:bg-navy-800 active:scale-[.98] transition text-white text-lg font-semibold px-10 py-4">Abfrage starten</button>
  </div>`;
  $('#btnStart').onclick = () => {
    SCHUELER.name = $('#inName').value.trim() || 'Schüler';
    SCHUELER.klasse = $('#inKlasse').value.trim();
    ANT = {}; OVERRIDE = {}; orderPool = shuffle(SCHEMA); SCHUELER.start = new Date(); SCHUELER.ende = null; BEMERKUNG = ''; ZEIT = {}; AUFRUFE = {}; aktivStep = null;
    step = 0; renderStep();
  };
}

function karte(a, inner) {
  const badge = a.art === 'Theorie'
    ? 'bg-violet-100 text-violet-700' : 'bg-emerald-100 text-emerald-700';
  return `
  <div class="fade bg-white rounded-3xl shadow-sm border border-slate-200 p-6 md:p-10">
    <div class="flex items-center gap-3 mb-4">
      <span class="w-10 h-10 rounded-xl bg-navy-700 text-white grid place-items-center font-bold text-lg">${step + 1}</span>
      <span class="text-xs font-semibold uppercase tracking-wider px-3 py-1 rounded-full ${badge}">${a.art}</span>
      <span class="text-slate-400 font-medium">${a.titel}</span>
    </div>
    ${['rabatt', 'skonto', 'einstand'].includes(a.id) ? fallBox() : ''}
    <h2 class="text-xl md:text-2xl font-semibold text-slate-900 leading-snug mb-2">${a.frage}</h2>
    ${a.hinweis ? `<p class="text-slate-500 mb-6">${a.hinweis}</p>` : '<div class="mb-6"></div>'}
    ${inner}
    <div class="flex justify-between gap-4 mt-10 pt-6 border-t border-slate-100">
      <button id="btnBack" class="rounded-2xl border border-slate-300 text-slate-600 font-semibold px-6 py-4 active:scale-[.98] transition">Zurück</button>
      <button id="btnNext" class="rounded-2xl bg-navy-700 text-white font-semibold px-8 py-4 active:scale-[.98] transition">${step === AUFGABEN.length - 1 ? 'Abfrage abschließen' : 'Weiter'}</button>
    </div>
  </div>`;
}

function renderStep() {
  setProgress();
  if (aktivStep !== step) {
    zeitErfassen(); aktivStep = step; stepStart = Date.now();
    const id = AUFGABEN[step].id; AUFRUFE[id] = (AUFRUFE[id] || 0) + 1;
  }
  const a = AUFGABEN[step];
  let inner = '';

  if (a.typ === 'order') {
    const seq = ANT.schema || (ANT.schema = []);
    inner = `
      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <div class="text-sm font-semibold text-slate-500 mb-3">Positionen</div>
          <div class="flex flex-wrap gap-3">
            ${orderPool.map(p => seq.includes(p)
              ? `<span class="rounded-xl border-2 border-dashed border-slate-200 text-slate-300 px-4 py-3 font-medium">${p}</span>`
              : `<button data-pick="${p}" class="rounded-xl bg-sky-50 border-2 border-sky-300 text-sky-900 px-4 py-3 font-semibold active:scale-95 transition">${p}</button>`).join('')}
          </div>
        </div>
        <div>
          <div class="text-sm font-semibold text-slate-500 mb-3">Schema</div>
          <ol class="space-y-2">
            ${SCHEMA.map((_, i) => seq[i]
              ? `<li><button data-remove="${i}" class="w-full text-left rounded-xl bg-navy-50 border-2 border-navy-200 px-4 py-3 font-semibold text-navy-800 flex gap-3"><span class="text-navy-500 tab w-5">${i + 1}.</span>${seq[i]}</button></li>`
              : `<li class="rounded-xl border-2 border-dashed border-slate-200 px-4 py-3 text-slate-300 flex gap-3"><span class="tab w-5">${i + 1}.</span>…</li>`).join('')}
          </ol>
        </div>
      </div>`;
  }

  if (a.typ === 'calc') {
    const v = ANT[a.id] || (ANT[a.id] = {});
    inner = a.vorspann() + `
      <div class="grid sm:grid-cols-2 gap-5">
        ${a.felder.map(f => `
          <label class="block">
            <span class="text-sm font-medium text-slate-600">${f.label}</span>
            <div class="mt-1 relative">
              <input data-field="${f.key}" type="text" inputmode="decimal" autocomplete="off" value="${esc(v[f.key] || '')}"
                class="tab w-full rounded-xl border border-slate-300 pl-4 pr-12 py-4 text-right font-semibold focus:outline-none focus:ring-4 focus:ring-sky-200 focus:border-sky-500">
              <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">€</span>
            </div>
          </label>`).join('')}
      </div>`;
  }

          <div class="flex-1 min-w-0">
            <div class="font-semibold">${a.titel} <span class="text-xs font-medium text-slate-400 ml-1">${a.art}</span></div>
            <div class="text-sm text-slate-500">${r.info}${r.soll ? ` <span class="text-slate-400">· Soll: ${r.soll}</span>` : ''}${r.auto != null && r.auto !== r.p ? ` <span class="text-amber-600 font-medium">· korrigiert (auto: ${r.auto})</span>` : ''}</div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button data-adj="${a.id}" data-d="-1" class="w-10 h-10 rounded-xl border border-slate-300 text-lg font-bold text-slate-600">−</button>
            <span class="w-14 text-center font-bold tab text-lg">${r.p}/${a.max}</span>
            <button data-adj="${a.id}" data-d="1" class="w-10 h-10 rounded-xl border border-slate-300 text-lg font-bold text-slate-600">+</button>
          </div>
        </summary>
        <div class="px-6 md:px-8 pb-6 pt-2 ml-0 md:ml-14">
          <div class="rounded-2xl bg-slate-50 border border-slate-200 p-4 md:p-5">${details(a, r)}</div>
        </div>
        </details>`; }).join('')}
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 md:p-8">
      <h2 class="font-bold text-lg text-navy-800 mb-4">Notenschlüssel</h2>
      <div class="grid grid-cols-3 sm:grid-cols-6 gap-3">
        ${SCHLUESSEL.map(([nn, p], i) => {
          const von = grenze(p), bis = i === 0 ? MAX : grenze(SCHLUESSEL[i - 1][1]) - 0.5;
          return `<div class="rounded-xl border ${nn === n ? 'border-navy-600 bg-navy-50' : 'border-slate-200'} p-3 text-center">
            <div class="text-2xl font-extrabold ${nn === n ? 'text-navy-700' : 'text-slate-700'}">${nn}</div>
            <div class="text-sm text-slate-500 tab">${String(von).replace('.', ',')}–${String(bis).replace('.', ',')}</div></div>`; }).join('')}
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 md:p-8">
      <h2 class="font-bold text-lg text-navy-800 mb-1">Dokumentation</h2>
      <p class="text-slate-500 mb-4">Erstellt eine PDF mit allen Antworten, Lösungen, Bewertungsregeln, Korrekturen und dem Notenschlüssel – z. B. zur Vorlage bei den Eltern.</p>
      <label class="block mb-4">
        <span class="text-sm font-medium text-slate-600">Bemerkung der Lehrkraft (optional, erscheint in der PDF)</span>
        <textarea id="inBem" rows="3" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-4 focus:ring-sky-200 focus:border-sky-500">${esc(BEMERKUNG)}</textarea>
      </label>
      <button id="btnPdf" class="w-full sm:w-auto rounded-2xl bg-sky-600 text-white font-semibold px-8 py-4 flex items-center justify-center gap-3 active:scale-[.98] transition">
        <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a1 1 0 0 1 1 1v8.6l2.3-2.3a1 1 0 1 1 1.4 1.4l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.4L9 11.6V3a1 1 0 0 1 1-1zM4 15a1 1 0 0 1 1 1v1h10v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1z"/></svg>
        Dokumentation als PDF sichern</button>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 justify-between">
      <button id="btnReview" class="rounded-2xl border border-slate-300 bg-white text-slate-600 font-semibold px-6 py-4">Zurück zu Aufgabe 7</button>
      <button id="btnNew" class="rounded-2xl bg-navy-700 text-white font-semibold px-8 py-4">Nächste Abfrage starten</button>
    </div>
  </div>`;

  document.querySelectorAll('[data-det]').forEach(d => d.addEventListener('toggle', () => { d.open ? OFFEN.add(d.dataset.det) : OFFEN.delete(d.dataset.det); }));
  $('#btnAlle').onclick = () => { if (OFFEN.size === AUFGABEN.length) OFFEN.clear(); else AUFGABEN.forEach(a => OFFEN.add(a.id)); renderErgebnis(); };
  document.querySelectorAll('[data-adj]').forEach(b => b.onclick = (e) => { e.preventDefault(); e.stopPropagation();
    const id = b.dataset.adj, a = AUFGABEN.find(x => x.id === id);
    const cur = res[id].p + (+b.dataset.d);
    OVERRIDE[id] = Math.min(a.max, Math.max(0, cur));
    if (OVERRIDE[id] === (res[id].auto ?? res[id].p) && res[id].auto === OVERRIDE[id]) delete OVERRIDE[id];
    renderErgebnis();
  });
  $('#inBem').oninput = e => { BEMERKUNG = e.target.value; };
  $('#btnPdf').onclick = () => pdfErstellen(res, sum, n);
  $('#btnReview').onclick = () => { SCHUELER.ende = null; step = AUFGABEN.length - 1; renderStep(); };
  $('#btnNew').onclick = () => {
    if (!confirm('Dokumentation gesichert? Alle Eingaben dieser Abfrage werden zurückgesetzt.')) return;
    SCHUELER = { name: '', klasse: SCHUELER.klasse }; ANT = {}; OVERRIDE = {}; OFFEN.clear(); renderStart();
  };
}

renderStart();
</script>
</body>
</html>
