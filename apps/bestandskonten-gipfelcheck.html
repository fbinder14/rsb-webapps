<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F2A4A">
<title>SnowPro Gipfelcheck · Eröffnung der Bestandskonten</title>
<style>
:root{
  --navy:#0F2A4A; --navy2:#1B3F6B; --ice:#EAF3FB; --ice2:#D6E8F6; --snow:#F6F9FC; --ink:#162231; --muted:#5B6E82; --line:#D3DFEA;
  --aktiv:#1F78C1; --aktiv-bg:#E6F1FA; --aktiv-tx:#155D98;
  --passiv:#D9741A; --passiv-bg:#FDF0E3; --passiv-tx:#A5520C;
  --ok:#188A5B; --ok-bg:#E3F5EC; --err:#C93A3A; --err-bg:#FCEAEA;
  --r:16px; --shadow:0 1px 2px rgba(15,42,74,.06),0 6px 18px rgba(15,42,74,.07);
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Helvetica Neue",Arial,sans-serif;background:var(--snow);color:var(--ink);font-size:17px;line-height:1.35;
  -webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,button{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;padding-top:max(10px,env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .logo{height:38px;width:auto;display:block}
.top h1{font-size:19px;margin:0;font-weight:700;color:var(--navy);letter-spacing:-.2px}
.top .sub{font-size:14px;color:var(--muted)}
.top .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--ice);color:var(--navy);font-weight:700;font-size:16px;min-height:44px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;font-weight:700;font-size:17px;transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:disabled{background:#B9C6D4;color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.small{min-height:44px;padding:0 14px;font-size:15px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--navy);color:#fff;padding:14px 22px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s ease;z-index:60;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet-bg{position:fixed;inset:0;background:rgba(15,42,74,.35);z-index:40;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86vh;background:#fff;border-radius:22px 22px 0 0;z-index:41;transform:translateY(105%);transition:transform .28s ease;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(15,42,74,.25)}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.stage{max-width:820px;margin:0 auto;padding:18px 20px calc(30px + env(safe-area-inset-bottom))}
.path{margin:6px 0 14px}
.path svg{width:100%;height:auto;display:block}
.q{padding:24px 24px 20px}
.tag{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy2);background:var(--ice);padding:5px 12px;border-radius:999px;margin-bottom:12px}
.q h2{font-size:23px;line-height:1.3;margin:0 0 18px;color:var(--navy)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;min-height:62px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:18px;line-height:1.3}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ice);color:var(--navy);font-weight:700;display:flex;align-items:center;justify-content:center}
.opt:active{transform:scale(.99)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--err);background:var(--err-bg)} .opt.wrong .k{background:var(--err);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;font-size:17px;display:none}
.fb.ok{display:block;background:var(--ok-bg);color:#0E6B45} .fb.no{display:block;background:#FFF6DD;color:#6B5200}
.fb b{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:flex-end;margin-top:16px}
.res{padding:34px 26px;text-align:center}
.res .score{font-size:56px;font-weight:700;color:var(--navy);line-height:1}
.res h2{margin:10px 0 6px;font-size:26px;color:var(--navy)}
.res p{color:var(--muted);margin:0 0 20px;font-size:18px}
.res .slogan{font-style:italic}
.rev{text-align:left;margin:0 0 22px;display:grid;gap:8px}
.rev div{padding:10px 14px;border-radius:12px;background:var(--snow);font-size:16px;display:flex;gap:10px}
.rev .m{font-weight:700}
.rev .m.ok{color:var(--ok)} .rev .m.no{color:#B26A00}
@media (max-width:600px){.q h2{font-size:20px}.opt{font-size:17px}}
@media (max-width:900px){.top .sub{display:none}.top h1{font-size:16px}.pill{font-size:14px;padding:6px 12px}.top{gap:10px;padding:8px 14px}}
</style>
</head>

  <div class="grow"></div>
  <span class="pill" id="prog">Frage 1 von 6</span>
</header>
<main class="stage">
  <div class="path" id="path"></div>
  <section class="panel" id="card"></section>
</main>
<script>
var QS = [
 {tag:'Teilziel 1 · beschreiben', q:'Die SnowPro hat die Schlussbilanz zum 31.12.2025 erstellt. Was gilt für die Eröffnungsbilanz zum 01.01.2026?',
  o:['Sie enthält dieselben Posten mit denselben Beträgen.','Sie beginnt leer, denn das neue Geschäftsjahr startet bei null.','Es werden nur die Aktiva übernommen.','Die Beträge werden zum Jahresbeginn neu bewertet und ändern sich.'],a:0,
  e:'Der Schlussbestand des alten Jahres ist der Anfangsbestand des neuen Jahres. Was am 31.12. im Lager liegt, liegt am 01.01. immer noch dort.'},
 {tag:'Teilziel 2 · zuordnen', q:'Ordne zu: Welche Kontonummer hat das Konto „Büromaschinen“?',
  o:['0860','0870','0840','0700'],a:0,
  e:'0860 BM gehört wie alle Sachanlagen zur Kontenklasse 0. 0870 ist „Büromöbel und Geschäftsausstattung“, 0840 ist der „Fuhrpark“.'},
 {tag:'Teilziel 2 · bestimmen', q:'Auf welcher Seite des Kontos 4400 VE (Verbindlichkeiten aus LL) steht der Anfangsbestand?',
  o:['Im Haben','Im Soll','Auf beiden Seiten je zur Hälfte'],a:0,
  e:'Verbindlichkeiten stehen in der Bilanz rechts (Passiva). Der Anfangsbestand steht im Konto auf derselben Seite, also im Haben.'},
 {tag:'Teilziel 2 · begründen', q:'Begründe: Warum steht der Anfangsbestand des Kontos „Fuhrpark“ im Soll?',
  o:['Der Posten steht in der Bilanz links (Aktiva) und der Anfangsbestand kommt im Konto auf dieselbe Seite.','Fahrzeuge kosten Geld und Ausgaben stehen immer im Soll.','Das Soll ist immer die „gute“ Seite eines Kontos.','Der Fuhrpark ist ein passives Bestandskonto.'],a:0,
  e:'Aktiva stehen links, also im Soll. Passiva stehen rechts, also im Haben. Die Seite in der Bilanz entscheidet über die Seite im Konto.'},
 {tag:'Teilziel 3 · überprüfen', q:'Alle 16 Konten der SnowPro sind eröffnet. Die Summe aller Anfangsbestände im Soll beträgt 1.545.000,00 €. Welche Summe muss im Haben stehen?',
  o:['1.545.000,00 €','900.500,00 €','644.500,00 €','0,00 €'],a:0,
  e:'Aktiva und Passiva sind in der Bilanz gleich groß. Deshalb müssen auch die Anfangsbestände im Soll und im Haben gleich groß sein. Das ist die Saldenkontrolle.'},
 {tag:'Gesamtziel · beurteilen', q:'Leon meint: „Die Eröffnung der Konten kann man sich sparen. Die Zahlen stehen doch schon in der Bilanz.“ Beurteile diese Aussage.',
  o:['Falsch. Im Jahr wird auf Konten gebucht, nicht in der Bilanz. Nur mit Anfangsbestand lassen sich Zu- und Abgänge fortschreiben und am Jahresende der Schlussbestand ermitteln.','Richtig. Die Bilanz reicht aus, die Konten entstehen bei der ersten Buchung von allein.','Richtig, aber nur bei den aktiven Bestandskonten.','Falsch, weil das Finanzamt jedes Konto einzeln eröffnet sehen will.'],a:0,
  e:'Die Bilanz ist nur eine Momentaufnahme. Die laufenden Buchungen brauchen Konten, die mit dem Anfangsbestand starten.'}
];
var S={i:0,score:0,log:[],locked:false,order:[]};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function path(){
  var n=QS.length,pts=[],i;for(i=0;i<n;i++){pts.push([50+i*(500/(n-1)),100-i*(66/(n-1))]);}
  var svg='<svg viewBox="0 0 600 130" role="img" aria-label="Fortschritt am Berg">';
  svg+='<polygon points="0,128 150,70 230,96 380,28 470,70 520,52 600,128" fill="#EAF3FB"/>';
  svg+='<polygon points="380,28 352,48 366,44 380,54 392,44 408,50" fill="#fff"/>';
  svg+='<polyline fill="none" stroke="#9FB2C6" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round" points="'+pts.map(function(p){return p.join(',');}).join(' ')+'"/>';
  pts.forEach(function(p,k){var l=S.log[k],cur=k===S.i&&S.i<n,fill='#fff',stroke='#9FB2C6';
    if(l===true){fill='#188A5B';stroke='#188A5B';} else if(l===false){fill='#D9741A';stroke='#D9741A';} else if(cur){stroke='#0F2A4A';}
    svg+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(cur?13:10)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+(cur?5:3)+'"/>';});
  var last=pts[n-1];svg+='<line x1="'+last[0]+'" y1="'+(last[1]-12)+'" x2="'+last[0]+'" y2="'+(last[1]-34)+'" stroke="#0F2A4A" stroke-width="3"/><polygon points="'+last[0]+','+(last[1]-34)+' '+(last[0]+22)+','+(last[1]-27)+' '+last[0]+','+(last[1]-20)+'" fill="#2F80C8"/>';
  document.getElementById('path').innerHTML=svg+'</svg>';
}
function render(){
  var c=document.getElementById('card');path();
  if(S.i>=QS.length){return result();}
  var q=QS[S.i];S.locked=false;S.order=shuffle(q.o.map(function(_,k){return k;}));
  document.getElementById('prog').textContent='Frage '+(S.i+1)+' von '+QS.length;
  var h='<div class="q"><span class="tag">'+esc(q.tag)+'</span><h2>'+esc(q.q)+'</h2><div class="opts">';
  S.order.forEach(function(k,j){h+='<button class="opt" data-k="'+k+'"><span class="k">'+'ABCD'.charAt(j)+'</span><span>'+esc(q.o[k])+'</span></button>';});
  h+='</div><div class="fb" id="fb"></div><div class="nav"><button class="btn primary" id="next" style="display:none">'+(S.i===QS.length-1?'Ergebnis ansehen':'Weiter')+'</button></div></div>';
  c.innerHTML=h;
  Array.prototype.forEach.call(c.querySelectorAll('.opt'),function(b){b.addEventListener('click',function(){answer(b);});});
  document.getElementById('next').addEventListener('click',function(){S.i++;render();window.scrollTo(0,0);});
}
function answer(b){
  if(S.locked)return;S.locked=true;var q=QS[S.i],k=+b.dataset.k,ok=k===q.a;S.log[S.i]=ok;if(ok)S.score++;
  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(o){var ok2=+o.dataset.k===q.a;if(ok2)o.classList.add('right');else if(o===b)o.classList.add('wrong');else o.classList.add('dim');});
  var fb=document.getElementById('fb');fb.className='fb '+(ok?'ok':'no');fb.innerHTML='<b>'+(ok?'Richtig!':'Nicht ganz.')+'</b>'+esc(q.e);
  document.getElementById('next').style.display='inline-flex';path();
  setTimeout(function(){fb.scrollIntoView({behavior:'smooth',block:'nearest'});},120);
}
function result(){
  var n=QS.length,s=S.score,t=s===n?'Gipfel erreicht!':(s>=n-2?'Fast oben!':'Gut gestartet!'),
  m=s===n?'Du hast alle Fragen richtig beantwortet.':(s>=n-2?'Schau dir die markierten Fragen noch einmal an.':'Wiederhole die Regel: Die Seite in der Bilanz entscheidet über die Seite im Konto.');
  document.getElementById('prog').textContent='Ergebnis';
  var rev='<div class="rev">'+QS.map(function(q,k){return '<div><span class="m '+(S.log[k]?'ok':'no')+'">'+(S.log[k]?'✓':'!')+'</span><span>'+esc(q.tag)+'</span></div>';}).join('')+'</div>';
  document.getElementById('card').innerHTML='<div class="res"><div class="score">'+s+' / '+n+'</div><h2>'+t+'</h2><p>'+m+'</p>'+rev+'<p class="slogan">Bereit für den nächsten Gipfel.</p><button class="btn primary" id="again">Noch einmal</button></div>';
  document.getElementById('again').addEventListener('click',function(){S={i:0,score:0,log:[],locked:false,order:[]};render();});
}
render();
</script>
